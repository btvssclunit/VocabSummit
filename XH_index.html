<!-- 学海起步 · 出发码头 — the pre-G1 tier for absolute beginners, reached from
     the dock on the landing sea map.
     STANDALONE on purpose: it loads xh.css / xh.js only, never cs.css/cs.js,
     and shares no storage with g1/g2/g3/hcl. See the header comment in xh.js.
     Exactly one berth is built (看图识词). The pinyin berths (声母 韵母 四声
     拼读 出海测验) are designed but explicitly out of scope for this slice.

     ⚠️ The ONE shared thing (owner 2026-08-15): identity. firebase-init.js +
     profile.js + nickname.js are loaded so the topbar carries the student's real
     nickname and avatar and opens the same 我的档案 panel as a stream page —
     being a different person at the dock than on the mountain would be worse
     than any duplication. cs.css is still NEVER loaded; the handful of rules
     those two files need are copied into xh.css. Progress stays sealed: nothing
     here reads or writes ws2_*. -->
<link rel="stylesheet" href="css/xh.css?v=20260823e">
</head>
<body>

<div class="xh-top">
  <!-- ⚠️ These three are STATIC markup, so their pinyin/English cannot come from
       xhPy() at render time — they are written out here instead (owner 2026-08-16:
       the pier's beginners need the scaffolding on every label, including the two
       that never re-render). Keep the .xh-py / .xh-en class names: the same
       body.xh-py-on / body.xh-en-on gates drive them. -->
  <a class="xh-back" href="index.html">← 海图<span class="xh-uipy">hǎi tú</span><span class="xh-en">sea map</span></a>
  <!-- ⚠️ .xh-id is a plaque: the bar lost its panel (owner 2026-08-22) and this is
       what keeps 出发码头 / 学海起步 legible over the pier's painted sea. -->
  <div class="xh-id">
    <h1>出发码头<span class="xh-uipy">chū fā mǎ tóu</span><span class="xh-en">The Beginner's Pier</span></h1>
    <!-- ⚠️ 副标 .lv 已整行删除（owner 2026-08-23:「this part is too cluttered, we can
         remove everything under the first 'the beginner's pier'」）。它是
         「词山学海 Vocab Summit · 学海起步」加自己的拼音与英文——三行，而第三行
         印的又是 The Beginner's Pier：同一块名牌上**同一句英文出现两次**。
         ⚠️ 学段名与它的拼音、英文都留着，那是 owner 2026-08-22 拆掉顶栏面板时的唯一
         条件（「we just have to ensure that the labels stay visible」）。
         ⚠️ 山上那条 .tb-sub 没有跟着删：它只有一行、没有注解，也不重复任何东西。 -->
  </div>
  <div class="xh-tools" id="xhTools"></div>
</div>

<div class="xh-wrap" id="xhView"></div>

     rather than growing a second one: the lobby, roster, reconnect, host controls and TTL
     are identical for both families, and what differs (the question renderer, the award
     hook, the distractor rule) arena.js already takes through ctx.
     ⚠️ podium.js comes WITH it — arena calls it to show the top three, and without it the
     end of a room round is a blank panel. It is the one shared module teacher.html also
     loads (§18b): no dependencies, no state, pure presentation. -->
