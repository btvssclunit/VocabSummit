<!-- 学海启航 · 启航码头 — the pre-G1 tier for absolute beginners, reached from
     the dock on the landing sea map.
     STANDALONE on purpose: it loads xh.css / xh.js only, never app.css/app.js,
     and shares no storage with g1/g2/g3/hcl. See the header comment in xh.js.
     Exactly one berth is built (看图识词). The pinyin berths (声母 韵母 四声
     拼读 出海测验) are designed but explicitly out of scope for this slice.

     ⚠️ The ONE shared thing (owner 2026-08-15): identity. firebase-init.js +
     profile.js + nickname.js are loaded so the topbar carries the student's real
     nickname and avatar and opens the same 我的档案 panel as a stream page —
     being a different person at the dock than on the mountain would be worse
     than any duplication. app.css is still NEVER loaded; the handful of rules
     those two files need are copied into xh.css. Progress stays sealed: nothing
     here reads or writes ws2_*. -->
<link rel="stylesheet" href="css/xh.css?v=20260816Ai">
</head>
<body>

<div class="xh-top">
  <!-- ⚠️ These three are STATIC markup, so their pinyin/English cannot come from
       xhPy() at render time — they are written out here instead (owner 2026-08-16:
       the pier's beginners need the scaffolding on every label, including the two
       that never re-render). Keep the .xh-py / .xh-en class names: the same
       body.xh-py-on / body.xh-en-on gates drive them. -->
  <a class="xh-back" href="index.html">← 海图<span class="xh-uipy">hǎi tú</span><span class="xh-en">sea map</span></a>
  <div>
    <h1>启航码头<span class="xh-uipy">qǐ háng mǎ tóu</span><span class="xh-en">The Departure Pier</span></h1>
    <!-- ⚠️ TIER, NOT MODE (owner 2026-08-16 晚). This read 「学海启航 · 看图学词 /
         Learn words from pictures」, which was wrong twice: 看图学词 was renamed
         词语闪卡, and it named ONE activity in the place where every mountain page
         names the stream's LEVEL (app.js setTopbar: 词山学海 Vocab Summit · G2
         普通学术华文). The pier is a tier of the same platform, so it says so.
         ⚠️ The pinyin covers the WHOLE visible Chinese string, not just the tail. -->
    <div class="lv">词山学海 Vocab Summit · 学海启航<span class="xh-uipy">cí shān xué hǎi · xué hǎi qǐ háng</span><span class="xh-en">Setting sail — the beginner tier</span></div>
  </div>
  <div class="xh-tools" id="xhTools"></div>
</div>

<div class="xh-wrap" id="xhView"></div>
