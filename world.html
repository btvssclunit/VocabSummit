<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>词山群岛 · Vocab Summit 航海试验版</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#7EC8E8;font-family:"Noto Sans SC",sans-serif;
    -webkit-user-select:none;user-select:none}
  canvas{display:block}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:center;pointer-events:none}
  .pill{background:rgba(15,35,60,.6);color:#fff;border-radius:999px;padding:7px 14px;font-size:14px}
  .pill a{color:#FFE9AD;text-decoration:none;pointer-events:auto}
  #dock{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);display:none;
    background:#FFF8E8;border:2px solid #D9A72B;border-radius:16px;padding:14px 22px;text-align:center;
    box-shadow:0 10px 26px rgba(10,25,45,.4)}
  #dock b{display:block;font-size:19px;color:#3A2C08;margin-bottom:4px}
  #dock a{display:inline-block;margin-top:8px;background:#D9A72B;color:#fff;font-weight:700;
    padding:9px 26px;border-radius:999px;text-decoration:none;font-size:15px}
  #joy{position:fixed;left:20px;bottom:20px;width:130px;height:130px;border-radius:50%;
    background:rgba(15,35,60,.35);border:1.5px solid rgba(255,255,255,.4);touch-action:none}
  #knob{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;
    border-radius:50%;background:rgba(245,196,67,.92);box-shadow:0 3px 8px rgba(10,20,40,.4)}
  #tip{position:fixed;right:14px;bottom:16px;color:rgba(255,255,255,.85);font-size:12px;
    background:rgba(15,35,60,.5);border-radius:999px;padding:5px 14px}
  @media (hover:hover) and (pointer:fine){ #joy{display:none} }
</style>
</head>
<body>
<div id="hud">
  <span class="pill">🌊 词山群岛 · 航海试验版</span>
  <span class="pill"><a href="index.html">‹ 回到词山学海</a></span>
</div>
<div id="dock"></div>
<div id="joy"><div id="knob"></div></div>
<div id="tip">🕹️ 摇杆 / WASD·方向键 驾船 · 靠近岛屿登岛</div>
<script src="three_min.js"></script>
<script>
(function () {
  "use strict";
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(0x8FD0EE);
  scene.fog = new THREE.Fog(0x9AD6F0, 140, 340);

  var camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 500);
  var renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);
  addEventListener("resize", function () {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  scene.add(new THREE.HemisphereLight(0xFFF6E0, 0x4E7DA6, 0.95));
  var sun = new THREE.DirectionalLight(0xFFE9B8, 0.9);
  sun.position.set(-60, 80, 40); sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
  sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
  scene.add(sun);
  var sunBall = new THREE.Mesh(new THREE.SphereGeometry(6, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xFFDD77 }));
  sunBall.position.set(-140, 60, -160); scene.add(sunBall);

  /* ---------- sea ---------- */
  var seaGeo = new THREE.PlaneGeometry(600, 600, 96, 96);
  seaGeo.rotateX(-Math.PI / 2);
  var sea = new THREE.Mesh(seaGeo, new THREE.MeshLambertMaterial({ color: 0x2E7FB8, transparent: true, opacity: 0.96 }));
  sea.receiveShadow = true; scene.add(sea);
  var seaPos = seaGeo.attributes.position;
  var seaBase = seaPos.array.slice();

  /* ---------- helpers ---------- */
  function mesh(geo, color, x, y, z, shadow) {
    var m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ color: color }));
    m.position.set(x, y, z);
    m.castShadow = shadow !== false; m.receiveShadow = true;
    return m;
  }
  function makeLabel(text, color) {
    var cv = document.createElement("canvas"); cv.width = 512; cv.height = 128;
    var g = cv.getContext("2d");
    g.fillStyle = "rgba(14,28,54,.82)"; g.strokeStyle = color; g.lineWidth = 8;
    function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r);
      g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
    rr(8, 8, 496, 112, 26); g.fill(); g.stroke();
    g.fillStyle = "#FFF"; g.font = "700 60px 'Noto Sans SC',sans-serif";
    g.textAlign = "center"; g.textBaseline = "middle"; g.fillText(text, 256, 66);
    var tex = new THREE.CanvasTexture(cv);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
    sp.scale.set(30, 7.5, 1);
    return sp;
  }

  /* ---------- islands ---------- */
  var ISLES = [
    { name: "词星大冒险", sub: "G1 基础华文", href: "G1_index.html", color: "#E3A63C", hex: 0xE3A63C, x: -58, z: -33, h: 26 },
    { name: "词将竞技场", sub: "G2 华文", href: "G2_index.html", color: "#5B7FC0", hex: 0x5B7FC0, x: 58, z: -45, h: 32 },
    { name: "词王淬炼坊", sub: "G3 华文", href: "G3_index.html", color: "#C46A34", hex: 0xC46A34, x: 62, z: 49, h: 38 },
    { name: "词圣鸿文苑", sub: "G3 高级华文", href: "HCL_index.html", color: "#6E8E7A", hex: 0x6E8E7A, x: -62, z: 57, h: 44 }
  ];
  var R = 20;
  ISLES.forEach(function (I) {
    var g = new THREE.Group();
    g.position.set(I.x, 0, I.z);
    var coneR = R - 9; // narrower than the base = a steeper, taller-reading peak
    /* base + slopes */
    g.add(mesh(new THREE.CylinderGeometry(R, R + 5, 3, 9), 0xD9C07A, 0, 0.4, 0));     // sand rim
    g.add(mesh(new THREE.CylinderGeometry(R - 4, R, 5, 9), 0x5E9A5B, 0, 3.5, 0));     // grass
    g.add(mesh(new THREE.ConeGeometry(coneR, I.h, 9), 0x6BA05F, 0, I.h / 2 + 5, 0));  // mountain
    g.add(mesh(new THREE.ConeGeometry(coneR * 0.5, I.h * 0.42, 9), I.hex, 0, I.h * 0.86 + 5, 0)); // rock cap, per-island colour for far-off ID
    /* pines */
    for (var p = 0; p < 7; p++) {
      var ang = p / 7 * Math.PI * 2 + I.h;
      var rr2 = R - 7 - (p % 3) * 3;
      var px = Math.cos(ang) * rr2, pz = Math.sin(ang) * rr2;
      var ph = 3 + (p % 3);
      g.add(mesh(new THREE.CylinderGeometry(0.3, 0.4, 1.6, 6), 0x6B4A2B, px, 4.6, pz));
      g.add(mesh(new THREE.ConeGeometry(1.6, ph, 7), 0x2F6B3C, px, 5.8 + ph / 2, pz));
    }
    /* summit pavilion: pillars + level-coloured roof */
    var top = I.h + 5 + I.h * 0.07;
    g.add(mesh(new THREE.CylinderGeometry(2.6, 2.6, 0.7, 8), 0xB9BDC4, 0, top + 0.35, 0));
    for (var q = 0; q < 4; q++) {
      var qa = q / 4 * Math.PI * 2 + Math.PI / 4;
      g.add(mesh(new THREE.CylinderGeometry(0.22, 0.22, 2.4, 6), 0x8A2F23,
        Math.cos(qa) * 1.7, top + 1.9, Math.sin(qa) * 1.7));
    }
    g.add(mesh(new THREE.ConeGeometry(3.2, 2.2, 4), I.hex, 0, top + 4.1, 0));
    /* flag */
    g.add(mesh(new THREE.CylinderGeometry(0.09, 0.09, 3.4, 5), 0xE8E2D2, 0, top + 6.4, 0));
    var flag = mesh(new THREE.BoxGeometry(2.4, 1.3, 0.08), I.hex, 1.1, top + 7.4, 0);
    g.add(flag); I.flag = flag;
    /* label */
    var lab = makeLabel(I.name + " · " + I.sub, I.color);
    lab.position.set(0, top + 12, 0); g.add(lab);
    scene.add(g);
  });

  /* ---------- boat ---------- */
  var boat = new THREE.Group();
  var hull = mesh(new THREE.BoxGeometry(3.0, 1.2, 6.2), 0x8A5A2E, 0, 0.6, 0);
  hull.geometry.translate(0, 0, 0);
  boat.add(hull);
  boat.add(mesh(new THREE.BoxGeometry(2.2, 0.7, 1.8), 0xA9743E, 0, 1.45, -1.4)); // stern cabin
  boat.add(mesh(new THREE.CylinderGeometry(0.12, 0.15, 4.6, 6), 0x5E3D1D, 0, 3.4, 0.3)); // mast
  var sail = mesh(new THREE.BoxGeometry(0.08, 3.0, 2.6), 0xF3E9D0, 0, 3.6, 1.0);
  boat.add(sail);
  boat.add(mesh(new THREE.ConeGeometry(0.9, 1.6, 4), 0x8A5A2E, 0, 0.7, 3.4)); // bow
  boat.position.set(0, 0, 0);
  scene.add(boat);

  /* ---------- input ---------- */
  var thrust = 0, steer = 0, keys = {};
  addEventListener("keydown", function (e) { keys[e.key.toLowerCase()] = 1; });
  addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = 0; });
  var joy = document.getElementById("joy"), knob = document.getElementById("knob");
  var jx = 0, jy = 0, jid = null;
  function jmove(e) {
    var r = joy.getBoundingClientRect();
    var dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
    var lim = r.width / 2 - 22, len = Math.hypot(dx, dy);
    if (len > lim) { dx *= lim / len; dy *= lim / len; }
    knob.style.transform = "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px))";
    jx = dx / lim; jy = dy / lim;
  }
  joy.addEventListener("pointerdown", function (e) { jid = e.pointerId; joy.setPointerCapture(jid); jmove(e); e.preventDefault(); });
  joy.addEventListener("pointermove", function (e) { if (jid !== null) jmove(e); });
  function jend() { jid = null; jx = jy = 0; knob.style.transform = "translate(-50%,-50%)"; }
  joy.addEventListener("pointerup", jend); joy.addEventListener("pointercancel", jend);

  /* ---------- dock UI ---------- */
  var dockEl = document.getElementById("dock");
  var docked = null;
  function setDock(I) {
    if (I === docked) return;
    docked = I;
    if (!I) { dockEl.style.display = "none"; return; }
    dockEl.innerHTML = "<b>⚓ " + I.name + "</b><span style='color:#7A6430;font-size:13px'>" + I.sub +
      "</span><br><a href='" + I.href + "'>登岛学词 ›</a>";
    dockEl.style.display = "block";
  }

  /* ---------- loop ---------- */
  var heading = 0, speed = 0, t0 = performance.now();
  function loop(t) {
    var dt = Math.min(0.05, (t - t0) / 1000); t0 = t;

    thrust = (keys["w"] || keys["arrowup"] ? 1 : 0) - (keys["s"] || keys["arrowdown"] ? 0.5 : 0) - jy;
    steer = (keys["a"] || keys["arrowleft"] ? 1 : 0) - (keys["d"] || keys["arrowright"] ? 1 : 0) - jx;
    thrust = Math.max(-0.6, Math.min(1, thrust));
    steer = Math.max(-1, Math.min(1, steer));

    speed += (thrust * 14 - speed) * Math.min(1, dt * 1.2);
    heading += steer * dt * (1.1 + Math.min(1, Math.abs(speed) / 10) * 0.6) * (speed >= 0 ? 1 : -1);
    boat.position.x -= Math.sin(heading) * speed * dt;
    boat.position.z -= Math.cos(heading) * speed * dt;
    var LIM = 240;
    boat.position.x = Math.max(-LIM, Math.min(LIM, boat.position.x));
    boat.position.z = Math.max(-LIM, Math.min(LIM, boat.position.z));

    /* island collision + dock detection */
    var near = null;
    for (var i = 0; i < ISLES.length; i++) {
      var I = ISLES[i];
      var dx = boat.position.x - I.x, dz = boat.position.z - I.z;
      var d = Math.hypot(dx, dz);
      if (d < R + 4) {                       // push out of the shore
        var k = (R + 4) / Math.max(0.001, d);
        boat.position.x = I.x + dx * k; boat.position.z = I.z + dz * k;
        speed *= 0.4;
      }
      if (d < R + 12) near = I;
      I.flag.rotation.y = Math.sin(t / 400 + i) * 0.3;
    }
    setDock(near);

    /* boat pose on waves */
    boat.rotation.y = heading;
    boat.position.y = 0.35 + Math.sin(t / 620) * 0.22;
    boat.rotation.z = Math.sin(t / 540) * 0.045 + steer * -0.06;
    boat.rotation.x = Math.sin(t / 700) * 0.03 - speed * 0.004;

    /* sea waves */
    var arr = seaPos.array;
    for (var v = 0; v < arr.length; v += 3) {
      var wx = seaBase[v], wz = seaBase[v + 2];
      arr[v + 1] = Math.sin(wx * 0.12 + t / 640) * 0.55 + Math.cos(wz * 0.1 + t / 830) * 0.45;
    }
    seaPos.needsUpdate = true;
    sea.position.x = boat.position.x; sea.position.z = boat.position.z;  // infinite-ish sea

    /* chase camera */
    var camT = new THREE.Vector3(
      boat.position.x + Math.sin(heading) * 19,
      13,
      boat.position.z + Math.cos(heading) * 19);
    camera.position.lerp(camT, Math.min(1, dt * 3));
    camera.lookAt(boat.position.x, 2.2, boat.position.z);

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
