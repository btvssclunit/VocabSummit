<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
/* ⚠️ 白屏保险丝（owner 2026-08-23 报的 G1／HCL 白屏）。整站是客户端渲染的：
   任何一个脚本在外壳建出来之前出事，学生看到的就是**一张全白的纸**——
   没有信息、没有下一步，老师也问不出所以然，而我在自己的机器上复现不了
   （四个源流在 JavaScriptCore 里拿真实线上数据全都正常开机）。
   ⚠️ 它不修任何 bug，它让 bug 说得出自己的名字。

   三张网，缺一张就漏掉一整类白屏：
   1) error / unhandledrejection —— 脚本**跑**出来的错（也接得住后面脚本的解析错误）。
   2) **capture 阶段**的 error —— 脚本／样式／图片**没下载下来**。
      ⚠️ 这一类不冒泡，普通监听收不到，而「某个 <script> 404 或超时」
      恰恰是白屏最常见的成因：没有任何 JS 错误，只是什么都没发生。
   3) 看门狗 —— 6 秒后外壳还没画出来就自己报到，并点名哪几个脚本没到齐。
      前两张网都沉默的白屏只有它能说话。

   ⚠️ 只在页面**确实是空的**时候说话（正文长度 ≤20 字），
   否则 Firebase 离线时的一个 rejection 就会盖掉一张好页面，那比白屏更糟。 */
(function () {
  var shown = 0, notes = [];
  var NEED = [["WSCloud","firebase-init"],["WSProfile","profile"],["WSPodium","podium"],
              ["WSArena","arena"],["WSSearch","search"],["WSTts","tts"]];
  function blank() {
    var b = document.body;
    if (!b) return true;
    /* ⚠️⚠️ 这个判断错一次的代价比白屏本身还大：判太松，看门狗会在 6 秒后
       **把一张好端端的页面抹掉**。20260823k 就是这样——我用了
       `b.offsetHeight === 0`，而这套版面下**健康页面的 body.offsetHeight 本来就是 0**
       （子元素撑的是 scrollHeight，实测 2457），于是每一页都在 6 秒后自毁。
       改用 **scrollHeight**：健康页面 2457，body 被 display:none 时是 0
       （隐藏元素既没有 scrollHeight 也没有 innerText）。两个条件覆盖三种情形：
         · 健康     —— 文字很长、scrollHeight 很大 → 不吭声
         · 被藏起来 —— scrollHeight 为 0           → 报警（HCL 那次的形状）
         · 没开机   —— 正文空                      → 报警
       ⚠️ 不要用 offsetHeight／clientHeight（这套版面下恒为 0），
       也不要拿 #view 当依据——落地页与码头根本没有这个元素。 */
    var t = (b.innerText || "").replace(/\s/g, "");
    return b.scrollHeight === 0 || t.length <= 20;
  }
  function paint(msg) {
    if (shown || !blank()) return;
    shown = 1;
    var missing = [];
    for (var i = 0; i < NEED.length; i++) if (!window[NEED[i][0]]) missing.push(NEED[i][1]);
    var a = document.getElementById("app") || document.body;
    if (!a) return;
    /* ⚠️ 先把 <body> 抢回来再说话。2026-08-23 的 HCL 白屏正是 body 自己被
       display:none —— 那种情况下这段话会画在一个隐藏的容器里，等于没说。
       保险丝必须能在「页面被整个藏起来」时依然开口。 */
    try {
      document.body.style.setProperty("display", "block", "important");
      document.body.style.setProperty("visibility", "visible", "important");
      document.body.style.setProperty("opacity", "1", "important");
    } catch (e) {}
    a.innerHTML = '<div style="margin:36px auto;max-width:520px;padding:20px 22px;' +
      'font:15px/1.75 system-ui,-apple-system,sans-serif;color:#25313D;background:#fff;' +
      'border:1px solid #E2E8EF;border-radius:14px">' +
      '<b style="font-size:17px">页面没能载入 Page failed to load</b><br>' +
      '请关掉这一页再重新打开。还是不行的话，把下面这一段告诉老师。<br>' +
      '<span style="font-size:13px;color:#5A7080">Close this tab and reopen. ' +
      'If it still fails, show your teacher the text below.</span>' +
      '<span style="display:block;margin-top:12px;padding:9px 11px;background:#F5F8FB;' +
      'border-radius:8px;font:12px/1.55 ui-monospace,Menlo,monospace;color:#40566B;' +
      'word-break:break-all">' + String(msg) +
      (missing.length ? '<br>MISSING: ' + missing.join(", ") : '<br>scripts: all loaded') +
      (notes.length ? '<br>' + notes.slice(0, 6).join('<br>') : '') +
      '<br>stream: ' + (window.STREAM || "-") + '</span></div>';
  }
  window.addEventListener("error", function (e) {
    paint(((e && e.message) || "script error") +
          (e && e.filename ? " @ " + e.filename + ":" + e.lineno : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    paint("rejected: " + ((r && (r.message || r)) || "?"));
  });
  /* capture 阶段：资源没下载下来。这一类不冒泡。 */
  window.addEventListener("error", function (e) {
    var t = e && e.target;
    if (!t || t === window || !t.tagName) return;
    var u = t.src || t.href || "?";
    notes.push("LOAD FAIL: " + String(u).split("/").slice(-1)[0]);
  }, true);
  /* 看门狗：前两张网都沉默的白屏，只有它能说话。 */
  setTimeout(function () { paint("timeout: nothing rendered after 6s"); }, 6000);
})();
</script>
