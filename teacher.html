<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师后台 · 词山学海 Vocab Summit · 百德中学</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* teacher.html is a STANDALONE page: it never loads cs.js / profile.js.
   Real Firebase Email/Password accounts + the teachers/{uid} allowlist are the
   only boundary (the repo is public, so a client-side password is not one). */
/* §2.2: the teacher side now carries the SAME identity as the student side —
   same palette tokens, same 山水 backdrop, Noto Serif SC headings over Noto Sans
   SC body, gold primaries on deep-sea navy. Tokens below are copied from
   cs.css :root deliberately; if the school palette ever changes, change both. */
:root{
  --sky1:#DFEDF7; --sky2:#BAD6E8;
  --sea1:#2E6391; --sea2:#1F4A70; --sea3:#173A5A;
  --ink:#243B4A; --ink-soft:#5A7080;
  --gold:#E3A63C; --gold-deep:#B7791F; --sun:#F5C443;
  --card:rgba(255,255,255,.94); --line:#C9DCE9;
  --ok:#3E7D57; --bad:#B44A3C;
  --serif:"Noto Serif SC","Songti SC","STSong",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
/* 仪表板环境背景: the same one-line ambience cs.css gives every student page
   ("study ambience: campsite backdrop under all app pages"). Fixed art/bg/study_bg.png —
   teacher.html deliberately does NOT import applyAmbience() / bg-01..05, the
   teacher backdrop never changes with mastery. The old sky→sea gradient stays as
   the BOTTOM layer, so a missing PNG degrades to the previous look, not a flat
   colour. Cards stay opaque, so the image only shows in the gaps between them. */
body{margin:0;font-family:var(--sans);color:var(--ink);line-height:1.6;min-height:100vh;
  background:#EAF2F8 no-repeat fixed center/cover;
  background-image:linear-gradient(rgba(246,250,253,.5),rgba(246,250,253,.5)),
    url("art/bg/study_bg.png"),
    linear-gradient(180deg,#EAF4FA 0%,var(--sky1) 30%,var(--sky2) 56%,var(--sea1) 88%,var(--sea3) 100%)}
h1,h2{font-family:var(--serif)}
/* 1180px left half a 1920px screen empty on the data-dense tabs. The tables are
   the reason this page exists, so the shell now tracks the viewport; .signin
   keeps its own narrow max-width, so the login card is unaffected. */
.wrap{max-width:min(1720px,97vw);margin:0 auto;padding:20px 18px 60px}
/* topbar echoes the student 顶栏: frosted plate, serif name, small caps sub,
   plus a small 校徽 chip (the cheapest brand anchor on a data-dense page). */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap;
  background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:16px;
  padding:12px 18px;backdrop-filter:blur(6px);box-shadow:0 6px 20px rgba(23,58,90,.12)}
.top h1{font-size:22px;margin:0;letter-spacing:.06em}
.crest{width:36px;height:36px;border-radius:50%;overflow:hidden;flex:none;background:#fff;
  border:2px solid var(--gold);box-shadow:0 3px 10px rgba(23,58,90,.2)}
.crest img{width:100%;height:100%;object-fit:cover;display:block}
.top .sub{font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em}
.spacer{margin-left:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  box-shadow:0 6px 20px rgba(23,58,90,.12);margin-bottom:16px}
.card>h2{margin-top:0;font-size:19px;letter-spacing:.06em}
.btn{border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;
  background:#fff;color:var(--sea1);cursor:pointer;font-weight:600;
  transition:transform .1s,border-color .12s;touch-action:manipulation}
.btn:hover{border-color:var(--sea1)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#3A2A08;font-weight:700;
  box-shadow:0 4px 12px rgba(227,166,60,.35)}
.btn:disabled{opacity:.5;cursor:default;box-shadow:none}
.btn.small{padding:6px 12px;font-size:12.5px}
input,select{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;
  font-family:inherit;color:var(--ink);background:#F7FAFC}
input:focus,select:focus{outline:none;border-color:var(--gold)}
label{font-size:12px;font-weight:700;color:#3A5A70;display:block;margin:10px 0 5px;letter-spacing:.14em}
.signin{max-width:400px;margin:7vh auto}
/* ---------- 登录页 = 全屏 hero，与 index.html 的 .lp-hero 同源写法 ----------
   Not a banner strip: art/bg/landing_hero_bg.png IS the viewport background and the
   sign-in card floats on it (translucent + blur), exactly like the student
   landing .lp-gate. body.gate is toggled in hideAll()/showSignedIn(), so ONLY
   the sign-in + 待审批/注册 screens get it; the dashboard keeps the study_bg
   ambience above. This is the one screen light enough to carry a full image. */
body.gate{background:#12213F url("art/bg/landing_hero_bg.png") center center/cover no-repeat fixed;
  image-rendering:pixelated}
body.gate .wrap{min-height:100vh;padding:24px 18px;display:flex;flex-direction:column;
  align-items:center}
body.gate .top{display:none}
/* Crest sits at the TOP of the hero (deep sky = contrast for light text; the
   sunrise band mid-image would wash it out), card centres in what is left.
   auto margins, not justify-content:center, so a tall 注册 pane on a short
   1024x600 Chromebook scrolls instead of being clipped at the top. */
body.gate .gate-crest{display:flex;margin:0 auto 18px}
body.gate .signin{margin:auto;width:100%;
  background:rgba(255,255,255,.93);backdrop-filter:blur(6px);
  border-color:rgba(255,255,255,.55);box-shadow:0 16px 40px rgba(8,16,34,.42)}
.gate-crest{display:none;flex-direction:column;align-items:center;text-align:center}
.gate-crest .ring{width:64px;height:64px;border-radius:50%;overflow:hidden;background:#fff;
  border:3px solid var(--gold);box-shadow:0 6px 18px rgba(8,16,34,.5)}
.gate-crest .ring img{width:100%;height:100%;object-fit:cover;display:block}
.gate-crest h1{font-size:20px;margin:10px 0 0;letter-spacing:.1em;color:#fff;
  text-shadow:0 2px 8px rgba(8,16,34,.6)}
/* double shadow (same trick as .lp-couplet): the sunrise band behind this text
   is near-white in places, so one soft shadow is not enough to hold it. */
.gate-crest .sub{font-size:11.5px;color:#FFE9B0;margin-top:4px;letter-spacing:.06em;
  text-shadow:0 0 3px rgba(8,16,34,.95),0 1px 7px rgba(8,16,34,.85)}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13.5px;
  background:rgba(255,255,255,.85);color:var(--ink-soft);cursor:pointer;touch-action:manipulation}
.tab.on{background:var(--gold);border-color:var(--gold);color:#3A2A08;font-weight:700;
  box-shadow:0 4px 14px rgba(227,166,60,.35)}
/* 概览统计条 = cs.css 的 .harbour 深海军玻璃条（金色衬线数字），取代原来的
   平面浅蓝方块；每个分类配一枚现成徽章当图标，零新增美术。 */
.harbour{background:rgba(18,42,66,.82);border:1px solid rgba(255,255,255,.2);border-radius:16px;
  padding:16px 22px;display:flex;gap:28px;color:#EAF4FA;justify-content:space-evenly;flex-wrap:wrap}
.harbour>div{text-align:center;min-width:76px}
.harbour>div>b{display:block;font-family:var(--serif);font-size:26px;font-weight:900;color:var(--sun)}
.harbour>div>span{font-size:11.5px;opacity:.85;letter-spacing:.06em}
.hb-icon{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#fff;margin:0 auto 7px;
  border:2px solid var(--gold);box-shadow:0 3px 10px rgba(8,16,34,.4)}
.hb-icon img{width:100%;height:100%;object-fit:cover;display:block}
/* keeps the row's baselines aligned for a category with no badge (未填写) */
.hb-icon.none{visibility:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #E7EFF6;white-space:nowrap}
th{color:#3A5A70;user-select:none;font-size:12px;letter-spacing:.06em;vertical-align:bottom}
tbody tr:hover{background:#F7FBFE}
.scroll{overflow-x:auto}
/* 班级视图 is 160+ rows: the header has to stay put while scrolling, so the
   table scrolls inside its own box rather than with the page. Sticky needs an
   OPAQUE header background (the card is translucent), hence the solid #F3F8FC. */
.tbl{overflow:auto;max-height:calc(100vh - 330px);min-height:260px;
  border:1px solid var(--line);border-radius:12px;background:#fff}
.tbl thead th{position:sticky;top:0;z-index:3;background:#F3F8FC;box-shadow:inset 0 -1px 0 var(--line)}
.wrapcell{white-space:normal;min-width:190px}
.col-n{text-align:right}
td.col-n b{font-size:13.5px}
.col-uid{width:1%}
.col-act{width:1%;white-space:nowrap}
code.uid{background:#F0F5FA;border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.btn.tiny{padding:2px 8px;font-size:11px;border-radius:8px;font-weight:600}
.btn.tiny.ok{background:#E4F0E6;border-color:#8FBF9E;color:#2F5A3C}
/* ---------- Excel 式表头筛选 ----------
   Header = clickable label (sort) + a separate ▼ button (filter), so sorting
   and filtering never fight over the same tap target. The dropdown is appended
   to <body>, not the cell, or .tbl's overflow would clip it. */
th .th-in{display:flex;align-items:center;gap:6px;justify-content:space-between}
th .th-lab{cursor:pointer;white-space:nowrap}
th .th-lab:hover{color:var(--sea1);text-decoration:underline}
th .fbtn{border:1px solid transparent;border-radius:6px;background:none;cursor:pointer;
  font-size:9px;color:#8AA2B4;padding:2px 4px;line-height:1;flex:none}
th .fbtn:hover{background:#E3EEF7;color:var(--sea1)}
th .fbtn.on{background:var(--gold);color:#3A2A08;border-color:var(--gold-deep)}
.fdd{position:absolute;z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;
  box-shadow:0 14px 36px rgba(23,58,90,.3);padding:11px 12px;width:262px;font-size:13px;
  max-width:calc(100vw - 16px)}
.fdd .fdd-t{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--gold-deep);
  letter-spacing:.06em;margin-bottom:8px}
.fdd input{width:100%}
.fdd .fmini{display:flex;gap:6px;margin:8px 0 6px}
.fdd .flist{max-height:224px;overflow:auto;border:1px solid var(--line);border-radius:9px;
  padding:5px 8px;background:#F9FCFE}
.fdd .flist label{display:flex;gap:7px;align-items:center;margin:0;padding:3px 0;cursor:pointer;
  font-weight:400;font-size:12.5px;letter-spacing:0;color:var(--ink);white-space:normal}
.fdd .flist label input{width:auto;flex:none}
.fdd .flist .fn{margin-left:auto;color:var(--ink-soft);font-size:11px;flex:none}
/* ⚠️ STACKED, not a 从[input]至[input] row (owner 2026-08-19: the end date was
   invisible on her SSOE laptop but fine on the Mac mini). Chrome on Windows draws
   input[type=date] far wider than Safari does — mm/dd/yyyy plus spinner plus a
   calendar button — and a flex item does not shrink below that intrinsic width
   (§14「grid/flex 子项不缩」), so the second box was pushed clean out of the 262px
   dropdown and clipped. min-width:0 alone would fix the overflow but leave two
   cramped boxes whose width depends on the platform; two rows are the same on
   every machine. minmax(0,1fr), never 1fr, for the same reason. */
.fdd .frange{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 8px;align-items:center}
.fdd .frange .fr-l{margin:0;font-size:12px;color:var(--ink-soft);letter-spacing:.04em;white-space:nowrap}
.fdd .frange input{min-width:0}
.fdd .fact{display:flex;gap:6px;margin-top:10px}
/* active-filter summary above the table: every filter is visible and removable
   in one place, so a teacher can never be confused by a hidden filter. */
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.fchip{display:inline-flex;align-items:center;gap:7px;background:#FBEEDA;border:1px solid var(--gold);
  border-radius:999px;padding:3px 6px 3px 11px;font-size:12px;color:#7A5310}
.fchip button{border:none;background:none;cursor:pointer;color:#7A5310;font-size:14px;
  line-height:1;padding:0 3px}
.fchip button:hover{color:var(--bad)}
/* 概览: two count tables side by side instead of one stretched across 1700px */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:16px;align-items:start}
.grid2>.card{margin-bottom:0}
.bar{background:#E9F1F8;border-radius:999px;height:7px;min-width:56px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--sun))}
.flag-bad{background:#FBEDE9}
.arena-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900;font-size:min(18vw,120px);
  letter-spacing:.1em;text-align:center;color:var(--ink);margin:12px 0;
  background:linear-gradient(180deg,#FFF8E6,#FDF0D2);
  border:3px solid var(--gold);border-radius:16px;padding:10px;
  box-shadow:0 6px 20px rgba(227,166,60,.3)}
.arena-live table td{font-size:15px;padding:9px 10px}
.arena-live:fullscreen{background:#fff;padding:28px;overflow:auto}
.arena-live:fullscreen .arena-code{font-size:min(22vw,180px)}
.hint{font-size:12px;color:var(--ink-soft);line-height:1.7}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#EAF1F8;color:#3A5A70}
.pill.ok{background:#E4F0E6;color:#2F5A3C}
.pill.warn{background:#FBEEDA;color:#7A5310}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
.tov{position:fixed;inset:0;background:rgba(20,40,70,.5);display:flex;align-items:center;
  justify-content:center;z-index:50;padding:20px}
.tov .card{max-width:420px;width:100%;margin-bottom:0}
/* ---------- 学生档案卡 (owner 2026-08-19) ----------
   ⚠️ THE CARD SCROLLS, THE OVERLAY DOES NOT. .tov is align-items:center; a centred
   flex container whose child is taller than itself overflows in BOTH directions and
   the top half can never be scrolled to (§18n — that is exactly how the room
   leaderboard lost its top two places). Capping the CARD and letting it scroll means
   the overlay is never taller than the viewport, so the trap does not exist here. */
.tov.wide .card{max-width:880px;max-height:calc(100vh - 40px);overflow:auto;position:relative}
.sp-x{position:absolute;top:10px;right:12px;border:none;background:none;cursor:pointer;
  font-size:17px;line-height:1;color:#8AA2B4;padding:4px 6px;border-radius:8px}
.sp-x:hover{background:#EAF1F8;color:var(--bad)}
.sp-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding-right:26px}
/* 132px matches 我的档案 on the student side (§18p): this is the one screen with room
   for the avatar to read as the student's face rather than as a form icon. */
.sp-av{width:96px;height:96px;border-radius:50%;overflow:hidden;background:#F0F5FA;
  border:3px solid var(--gold);flex:none;box-shadow:0 4px 14px rgba(23,58,90,.18)}
.sp-av img{width:100%;height:100%;object-fit:cover;display:block}
.sp-id{min-width:0;flex:1 1 260px}
.sp-id h2{margin:0 0 5px}
.sp-meta{font-size:13px;color:var(--ink-soft);line-height:1.8}
.sp-uid{font-size:12px;color:var(--ink-soft);margin-top:5px}
.sp-uid code{background:#F0F5FA;border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.sp-land{border:1px solid var(--line);border-radius:13px;padding:12px 14px;margin-bottom:12px;
  background:#F9FCFE}
.sp-land.pier{background:#F5FAFD;border-color:#CFE2EF}
.sp-land.code{background:#FFFBF2;border-color:var(--gold)}
.sp-land-t{font-family:var(--serif);font-weight:700;font-size:14px;color:var(--gold-deep);
  letter-spacing:.06em;margin-bottom:9px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
/* auto-FIT, not auto-fill: auto-fill keeps the empty tracks, so a land with five stats
   in an eleven-track grid stops three-quarters of the way across and reads as cut off
   (§18q). minmax(0,…) so a long value shrinks instead of pushing the row out (§14). */
.sp-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.sp-stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.sp-stat>b{display:block;font-family:var(--serif);font-size:19px;font-weight:900;color:var(--gold-deep);
  line-height:1.25;word-break:break-all}
.sp-stat>span{display:block;font-size:11px;color:var(--ink-soft);letter-spacing:.04em;margin-top:2px}
.sp-stat>span>i{font-style:normal;opacity:.72}
.sp-rec{font-size:12px;color:var(--ink-soft);margin-top:9px}
.sp-aidland{border-top:1px solid var(--line);padding:8px 0 4px}
.sp-aidland:first-child{border-top:0;padding-top:0}
.sp-aidhead{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:5px;
  display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.sp-aidrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:3px 0;font-size:12.5px}
.sp-aidname{min-width:66px;color:var(--ink-soft)}
.sp-aidwhen{font-weight:700;color:var(--ink-soft)}
.sp-aidwhen.ok{color:#2F5A3C}
.sp-aidwhen.warn{color:#7A5310}
.sp-aidact{color:var(--ink-soft)}
/* the flip history is the supporting detail, not the headline — it wraps to its own
   line on a narrow card rather than competing with the verdict */
.sp-aidtrail{flex:1 1 100%;font-size:11.5px;color:#8AA2B4;font-family:ui-monospace,Menlo,Consolas,monospace}
.sp-empty{padding:14px 0}
.sp-codebox{margin-top:9px}
textarea.sp-code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;
  line-height:1.5;word-break:break-all;border:1px solid var(--line);border-radius:10px;
  padding:9px 10px;background:#fff;resize:vertical}
.sp-codeact{display:flex;gap:10px;align-items:center;margin-top:7px;flex-wrap:wrap}
/* same treatment as the student's own screen: this gets read aloud or copied into an
   email, so legibility beats elegance. user-select:all — a partial selection is a
   wrong code, and a wrong code reads to a student as「my progress is gone」. */
.sp-claim{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:21px;font-weight:800;
  letter-spacing:.15em;user-select:all;color:var(--ink);background:#fff;
  border:2px solid var(--gold);border-radius:10px;padding:8px 10px;margin:2px 0 7px;
  display:inline-block;word-break:break-all}
.sp-foot{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
/* the whole row opens the card, so it has to look clickable — and on a laptop trackpad
   hover is the only affordance there is. 操作 keeps its own buttons; they stopPropagation. */
tbody tr.sp-row{cursor:pointer}
@media (max-width:560px){
  .sp-av{width:72px;height:72px}
  .sp-stats{grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}
}
/* §2.2 出题设置: mode-specific settings sit in their own inset panel so it reads
   as "these belong to the mode you picked", not as more page-level controls. */
.cfg-sub{background:#F4F9FD;border:1px solid #DBE7F1;border-radius:13px;
  padding:4px 14px 14px;margin-top:10px}
.cfg-sub .cfg-sub-t{font-family:var(--serif);font-weight:700;font-size:13.5px;
  color:var(--gold-deep);letter-spacing:.08em;margin-top:12px}
/* ---------- 出题设置 = 学生 ①复习范围 的同一套选择法 (owner 2026-08-17) ----------
   Before this the 单元范围 was 29 bare checkboxes in a flat wall three rows deep,
   and every other control was a stacked <label> + widget. The student home solved
   the same problem long ago (accordion by 年级, gold unit chips, one 全选/清空 pair
   sharing the summary row, quantities on sliders), so the values below are COPIED
   from css/cs.css and marked ⟨cs.css⟩ — the same deliberate duplication
   teacher.html already carries for the palette (CLAUDE.md §17).
   ⚠️ cs.css 改了，这里要跟着改。
   ⚠️ Two knowing differences from the student card, both because this is a
   teacher on a laptop and not a G1 student on an iPad:
   · no 拼音/英文 glosses (this whole page is Chinese, staff only);
   · the panel is TWO COLUMNS from 1080px up — the 出题设置 card sits in a 1720px
     shell, so one column left two thirds of the row empty and pushed 生成擂台码
     below the fold. */
.ar-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:0 26px;align-items:start}
/* 1000px, not 1080: a 1024x768 school Chromebook is the narrowest machine this
   page is opened on, and measured there two columns put ①–④ all within one
   screen while stacked columns pushed 模式 below the fold. */
@media (min-width:1000px){.ar-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.ar-col{min-width:0}                    /* §14: grid children do not shrink on their own */
/* ⟨cs.css .section-label⟩ — the numbered 动线 pill. This screen IS a multi-step
   decision (科目 → 范围 → 模式 → 题数), which is what §7 reserves numbering for;
   mode-specific settings stay UNNUMBERED, they are a detail of ③ and not a step. */
.ar-step{display:inline-block;font-size:12.5px;font-weight:700;letter-spacing:.2em;
  color:var(--ink);margin:16px 2px 9px;padding:6px 15px;border-radius:999px;
  background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 3px 12px rgba(23,58,90,.14)}
.ar-col>.ar-step:first-child{margin-top:2px}
.ar-step .n{font-family:var(--serif);font-weight:900;color:var(--gold-deep);margin-right:7px}
.ar-tiles{display:flex;flex-wrap:wrap;gap:8px}
/* ⚠️ 五个模式排 3 + 2，不是 wrap flex 的 4 + 1（§18f/§18q 那条又一次）：wrap 会让
   词雨灵露 一张卡独占整行，读起来像它是个特例。三列刚好把它切成「三种答题 / 两个
   游戏」，与学生端 学习挑战 / 闯关 的分法一致。列数写死，不用 auto-fill。 */
.ar-tiles.m3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:700px){.ar-tiles.m3{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* ⟨cs.css .dopt⟩ — flex:1 1 auto so two, four or five tiles all fill the row */
.ar-tile{flex:1 1 auto;border:1px solid #C9DCE9;border-radius:13px;padding:9px 14px;
  background:#fff;color:var(--ink);text-align:left;cursor:pointer;line-height:1.3;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 2px 8px rgba(23,58,90,.09);
  transition:background .15s ease,border-color .15s ease;touch-action:manipulation}
.ar-tile:hover{border-color:var(--sea1)}
.ar-tile b{display:block;font-size:14.5px}
.ar-tile span{display:block;font-size:11.5px;color:var(--ink-soft);margin-top:1px}
.ar-tile.on{background:var(--gold);border-color:var(--gold);font-weight:700;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 12px rgba(227,166,60,.35)}
.ar-tile.on b{color:#3A2A08}
.ar-tile.on span{color:#6B5010}
/* fixed-height scroll box, like #scopeCard in landscape: without it, opening 中一
   pushed 模式 and 生成擂台码 down the page and the card changed height on every
   click. Height, not max-height — max-height still grows to the ceiling. */
.scope-box{height:clamp(240px,42vh,420px);overflow-y:auto;overscroll-behavior:contain;
  background:#F7FAFC;border:1px solid var(--line);border-radius:12px;padding:10px 13px}
/* ⟨cs.css .scope-top/.scope-sum/.scope-acts⟩ — 已选 N 个单元 left, the pair right.
   ⚠️ A normal flex child, NOT position:absolute: the box scrolls inside itself and
   an absolute corner would scroll away with it. */
.scope-top{display:flex;align-items:center;justify-content:space-between;gap:10px;
  flex-wrap:wrap;margin-bottom:8px}
.scope-sum{font-size:13px;color:#8A5A0F;font-weight:700;min-width:0}  /* not --gold-deep: 3.19:1 fails for small text */
.scope-acts{display:flex;gap:6px;margin-left:auto;flex:none}
.scope-acts .unit{font-weight:700;padding:5px 12px;font-size:13px}
/* ⟨cs.css .scope-acc⟩ — exclusive accordion: at most one 年级 open at a time */
.scope-acc{display:flex;align-items:center;width:100%;gap:8px;background:none;border:none;
  border-top:1px solid #E4EDF4;padding:11px 2px 8px;font-size:14px;font-weight:700;
  color:#3A5A70;cursor:pointer;text-align:left;font-family:inherit}
.scope-acc .cnt{font-weight:400;font-size:12.5px;color:var(--ink-soft)}
.scope-acc .chev{margin-left:auto;color:#4E6273;transition:transform .18s}
.scope-acc.open .chev{transform:rotate(90deg)}
/* ⟨cs.css .units/.unit⟩ — gold when picked, same as the student's units */
.units{display:flex;flex-wrap:wrap;gap:8px}
.units.collapsed{display:none}
.unit{border:1px solid #B9CEDD;border-radius:14px;padding:7px 13px;font-size:14px;
  color:var(--ink-soft);background:#fff;cursor:pointer;font-family:inherit;
  display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.25;gap:1px}
.unit b{font-size:14px;color:var(--ink)}
.unit-theme{font-size:11.5px;color:#8AA0B0}
.unit-n{font-size:11px;color:var(--ink-soft)}
.unit.on{background:var(--gold);border-color:var(--gold)}
.unit.on b,.unit.on .unit-n{color:#3A2A08}
.unit.on .unit-theme{color:#6B5010}
/* ⟨cs.css .qty*⟩ — 题数 / 时长 were native <select> dropdowns, the only two
   controls on the page you had to open before you could see the choices.
   ⚠️ The readout sits ABOVE the track, never beside it, or the track length
   changes with the label's width. */
.ar-qtys{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:0 20px}
.qty{margin:2px 0 6px;min-width:0}
.qty-lab{font-size:11.5px;letter-spacing:.2em;color:var(--ink-soft)}
.qty-val{display:block;font-family:var(--serif);font-weight:800;font-size:17.5px;color:var(--ink)}
.qty-track{position:relative;padding:9px 0}
.qty-ticks{position:absolute;left:13px;right:13px;top:50%;transform:translateY(-50%);
  display:flex;justify-content:space-between;pointer-events:none}
.qty-ticks i{width:3px;height:3px;border-radius:50%;background:rgba(23,58,90,.3)}
.qty-range{-webkit-appearance:none;appearance:none;display:block;width:100%;height:26px;
  background:none;margin:0;padding:0;border:none}
.qty-range:focus{outline:none}
.qty-range:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:8px}
.qty-range::-webkit-slider-runnable-track{height:8px;border-radius:999px;
  background:linear-gradient(90deg,#DCE9F2,#C7DDEC)}
.qty-range::-moz-range-track{height:8px;border-radius:999px;
  background:linear-gradient(90deg,#DCE9F2,#C7DDEC)}
.qty-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:28px;height:28px;
  border-radius:50%;background:var(--gold);border:2px solid #fff;margin-top:-10px;
  box-shadow:0 3px 10px rgba(227,166,60,.5);cursor:pointer}
.qty-range::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:var(--gold);
  border:2px solid #fff;box-shadow:0 3px 10px rgba(227,166,60,.5);cursor:pointer}
/* the one primary action, on its own line under both columns */
.ar-go{grid-column:1/-1;border-top:1px solid #E4EDF4;margin-top:16px;padding-top:14px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ar-go .msg{margin-top:0}
/* ---- 意见反馈工单 (2026-08-14) ---- */
.fb-badge{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:6px;
  border-radius:999px;background:#C4553F;color:#fff;font-size:11px;font-weight:800;vertical-align:1px}
.fb-filters{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.fchip-btn{border:1px solid #C4D5E2;background:#fff;color:#5A7080;border-radius:999px;
  padding:6px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.fchip-btn.on{background:linear-gradient(180deg,#FBEBC4,#F2D89A);border-color:var(--gold);color:#6B4A05}
.fb-ticket{margin-top:12px}
.fb-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb-pill{border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;border:1px solid #D8E4EC;background:#F3F8FC;color:#4E6273}
.fb-pill.s-new{background:#FDECE7;border-color:#EFC0B2;color:#8C3A22}
.fb-pill.s-open{background:#FFF4D9;border-color:#EFD9A4;color:#7A5B12}
.fb-pill.s-resolved{background:#E8F3EC;border-color:#A9CDB6;color:#1E5138}
.fb-pill.s-wontfix{background:#EEF2F5;border-color:#CBD7E0;color:#6B7885}
.fb-when{margin-left:auto;font-size:12px;color:#7C8B98}
.fb-ctx-line{margin-top:9px;padding:6px 11px;border-radius:9px;font-size:12.5px;font-weight:600;
  background:#FFF7E4;border:1px solid #EFD9A4;color:#6B4A05;display:inline-block}
.fb-text{margin:10px 0;font-size:15px;line-height:1.65;color:var(--ink);white-space:pre-wrap;word-break:break-word}
.fb-meta{font-size:12px;color:#6B7885;line-height:1.6}
.fb-meta code{background:#EEF4F9;border-radius:4px;padding:1px 5px}
.fb-ua{margin-top:6px;font-size:11.5px;color:#7C8B98}
.fb-ua code{word-break:break-all}
.fb-note{width:100%;box-sizing:border-box;margin-top:10px;padding:9px 11px;border:1px solid #C4D5E2;
  border-radius:9px;font-size:13.5px;background:#fff}
.fb-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.fb-actions .btn{padding:7px 13px;font-size:12.5px}
.fb-ban{margin-left:auto;color:#8C3A22;border-color:#EFC0B2}
.fb-handled{margin-top:7px;font-size:11.5px;color:#7C8B98}


/* ---------- 颁奖台 (js/podium.js) ----------
   ⚠️ 这段在 cs.css 与 teacher.html 各有一份：教师端不加载 cs.css。改一处要改两处。 */
/* 颁奖台底图 = 落地页那张登山图（owner 2026-08-16）。压淡是为了让名字和分数读得清。
   ⚠️ 这里写 art/…（内联 <style> 相对**页面**解析）；cs.css 那一份写 ../art/…
   （相对**样式表**解析）。这是两份拷贝唯一合理的差异。 */
.pod-overlay{position:fixed;inset:0;z-index:200;display:flex;align-items:center;
  justify-content:center;padding:20px;overflow:hidden;
  background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.68)),
    url("art/bg/landing_hero_bg.png") center/cover no-repeat;
  image-rendering:pixelated;animation:podFade .35s ease-out both}
@keyframes podFade{from{opacity:0}to{opacity:1}}
.pod-wrap{position:relative;z-index:2;width:min(900px,100%);display:flex;
  flex-direction:column;align-items:center}
.pod-x{margin-top:22px;font-size:15px;font-weight:800;color:#fff;
  background:linear-gradient(180deg,#3E7FB0,#2E6391);border:0;border-radius:999px;
  padding:11px 34px;cursor:pointer;touch-action:manipulation;
  box-shadow:0 6px 18px rgba(10,28,48,.35)}
.pod-x:active{transform:translateY(1px)}
.pod-confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.pod-title{font-family:var(--serif,"Noto Serif SC"),serif;font-weight:900;
  font-size:clamp(21px,2.8vw,40px);text-align:center;margin-bottom:12px}
.pod-stage{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,2vw,22px)}
.pod-col{display:flex;flex-direction:column;align-items:center;flex:0 1 clamp(92px,21vw,210px);
  animation:podRise .55s cubic-bezier(.22,1.2,.36,1) both;animation-delay:var(--d,0s)}
@keyframes podRise{from{transform:translateY(26px);opacity:0}to{transform:none;opacity:1}}
.pod-who{display:flex;flex-direction:column;align-items:center;gap:3px;margin-bottom:7px;min-width:0;width:100%}
.pod-av{width:clamp(46px,7vw,96px);height:clamp(46px,7vw,96px);border-radius:50%;object-fit:contain;
  background:rgba(255,255,255,.9);border:2.5px solid var(--gold,#E3A63C);
  box-shadow:0 4px 14px rgba(10,28,48,.3)}
.pod-av.none{display:flex;align-items:center;justify-content:center;font-size:26px}
.pod-name{font-weight:800;font-size:clamp(12px,1.3vw,19px);text-align:center;line-height:1.25;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod-score{font-family:var(--serif,"Noto Serif SC"),serif;font-weight:900;
  font-size:clamp(15px,1.8vw,26px);color:var(--gold-deep,#B7791F)}
/* the block heights ARE the ranking — 1st tallest. Keep gold > silver > bronze. */
.pod-block{width:100%;border-radius:12px 12px 0 0;display:flex;flex-direction:column;
  align-items:center;justify-content:flex-start;gap:2px;padding-top:8px;
  border:1px solid rgba(255,255,255,.5);border-bottom:0}
.pod-col.gold   .pod-block{height:clamp(92px,13vw,182px);background:linear-gradient(180deg,#F7D774,#D9A02C)}
.pod-col.silver .pod-block{height:clamp(68px,9.5vw,134px);background:linear-gradient(180deg,#E4EBF1,#B4C2CE)}
.pod-col.bronze .pod-block{height:clamp(54px,7.5vw,106px);background:linear-gradient(180deg,#E6B489,#BE8151)}
.pod-medal{font-size:clamp(20px,2.4vw,30px);line-height:1}
.pod-rank{font-family:var(--serif,"Noto Serif SC"),serif;font-weight:900;
  font-size:clamp(15px,1.7vw,21px);color:rgba(10,28,48,.62)}
.pod-col.me .pod-av{border-color:#fff;box-shadow:0 0 0 3px var(--gold,#E3A63C),0 4px 14px rgba(10,28,48,.35)}
@media (prefers-reduced-motion:reduce){.pod-col{animation:none}}

.ar-av{width:26px;height:26px;border-radius:50%;object-fit:contain;display:block;
  background:#fff;border:1.5px solid var(--gold)}
.ar-av.none{display:flex;align-items:center;justify-content:center;font-size:14px}

       ⚠️ THIS IS THE SECOND WRITER OF THE WIRE FORMAT. I shipped the profile.js half

          if (c.parentNode.style.display !== "none") c.checked = on;
        });
      };
      dd.querySelector("#fAll").onclick = function () { setAll(true); };
      dd.querySelector("#fNone").onclick = function () { setAll(false); };
    }
    if (q) q.focus();

    dd.querySelector("#fApply").onclick = function () {
      if (col.type === "list") {
        var vals = {}, n = 0;
        Array.prototype.forEach.call(dd.querySelectorAll(".fv"), function (c) {
          if (c.checked) { vals[c.value] = 1; n++; }
        });
        if (n === keys.length) delete _colF[col.k];      // everything ticked = no filter
        else _colF[col.k] = { vals: vals };
      } else if (col.type === "text") {
        var s = dd.querySelector("#fq").value.trim();
        if (s) _colF[col.k] = { q: s }; else delete _colF[col.k];
      } else {
        var lo = dd.querySelector("#fmin").value.trim(), hi = dd.querySelector("#fmax").value.trim();
        if (lo || hi) _colF[col.k] = { min: lo, max: hi }; else delete _colF[col.k];

      renderPanel();
    };
    dd.querySelector("#fClear").onclick = function () { delete _colF[col.k]; closeFilterDrop(); renderPanel(); };
    dd.querySelector("#fCancel").onclick = closeFilterDrop;

    _dd.onDoc = function (e) { if (_dd.el && !_dd.el.contains(e.target)) closeFilterDrop(); };
    _dd.onKey = function (e) { if (e.key === "Escape") closeFilterDrop(); };
    // deferred, or the very click that opened this dropdown closes it again
    setTimeout(function () {
      if (!_dd.el) return;
      document.addEventListener("mousedown", _dd.onDoc, true);
      document.addEventListener("keydown", _dd.onKey, true);
    }, 0);
  }

  /* every active filter is listed above the table and removable there, so a
     teacher can never be left staring at a short list without seeing why */
  function filterBarHtml() {
    var out = [];
    classCols().forEach(function (c) {
      var f = _colF[c.k];

      if (c.type === "list") {

        d = !ks.length ? "（未选任何值）" : (ks.length <= 2 ? ks.join("、") : ks.length + " 个值");
      } else if (c.type === "text") { d = "含「" + f.q + "」"; }
      else { d = (f.min || "不限") + " – " + (f.max || "不限"); }
      out.push('<span class="fchip">' + esc(c.label) + '：' + esc(d) +

    });

    return '<div class="fbar">' + out.join("") +
      '<button class="btn small" id="fClearAll">清除所有筛选</button></div>';
  }
  function wireFilterBar(panel) {
    Array.prototype.forEach.call(panel.querySelectorAll(".fx"), function (b) {
      b.onclick = function () { delete _colF[b.getAttribute("data-k")]; renderPanel(); };

  /* UID is 28 chars: the column shows the first 8 (enough to eyeball against a
     student's 技术编号, which shows 6) and this copies the full string for the
     处理 tab / Firestore console. execCommand fallback for non-secure origins. */
  function copyUid(txt, btn) {
    var done = function () {
      var old = btn.textContent;
      btn.textContent = "已复制";
      btn.classList.add("ok");
      setTimeout(function () { btn.textContent = old; btn.classList.remove("ok"); }, 1200);
    };
    var fallback = function () {
      var ta = document.createElement("textarea");
      ta.value = txt;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      ta.parentNode.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, fallback);
    } else { fallback(); }
  }

  var DECO_ZH = {
    fire: "篝火", flag: "营旗", stonelantern: "石灯笼", bamboofence: "竹篱笆", windchime: "风铃",
    cat: "打盹的猫", waterjar: "水缸", signpost: "木牌路标", pine: "青松", pavilion: "小亭",

  /* ================= 学生档案卡 (owner 2026-08-19) =================================
     owner: 「can it be redesigned such that when I click on a student, I can see their
     profile page?」. 班级视图 is a 14-column wall: it answers「how is the class doing」
     well and「how is THIS student doing」not at all — the four 掌握 columns are the only
     per-student numbers in it, and everything the student actually accumulated (历练值,
     灵露, 段位, 徽章, 纪录, 连续学习天数, the whole 出发码头) was loaded into the browser
     and never shown. This card is that one student's page.
     ⚠️ READ-ONLY except for the HOD's existing 编辑资料 path, which is unchanged and
     still writes ONLY the top-level profile field (the Firestore rule enforces that, not
     this code). Nothing here can touch mastery data.
     ⚠️ THE CARD SCROLLS INSIDE ITSELF, the overlay does not. .tov is a centred flex box,
     and §18n is the scar: a centred flex container whose content is taller than itself
     overflows BOTH ways and the top half is unreachable, because scrollTop 0 is already
     below the first row. Giving the card its own max-height + overflow means the overlay
     never overflows at all, so the trap cannot be reached rather than being worked around. */
  function avatarSrcById(id) {
    /* every entry in profile.js's AVATAR_CATALOG follows art/avatar/avatar_{id}.png
       (verified across all 21). ⚠️ The <img> carries an onerror that hides it, so a
       future id that breaks the convention degrades to「no picture」rather than to a
       broken-image glyph next to the student's name. */
    return id ? ("art/avatar/avatar_" + id + ".png") : "";
  }
  var LADDER = {
    g1:  [["初行客", 0], ["寻径人", 600], ["踏云者", 2500], ["凌霄客", 11000]],
    g2:  [["初行客", 0], ["寻径人", 700], ["踏云者", 3100], ["凌霄客", 14000]],
    g3:  [["初行客", 0], ["寻径人", 800], ["踏云者", 3500], ["凌霄客", 16000]],
    hcl: [["初行客", 0], ["寻径人", 1000], ["踏云者", 4200], ["凌霄客", 18500]]
  };
  function rankOf(stream, total) {
    var lad = LADDER[stream] || LADDER.g1, cur = lad[0];
    for (var i = 0; i < lad.length; i++) if ((total || 0) >= lad[i][1]) cur = lad[i];
    return cur[0];

  var _arena = { code: null, unsub: null, punsub: null, room: null, players: [], tick: null, json: {} };
  /* ⚠️ limitBy: 一场只有一个结束条件（owner 2026-08-18）。以前 题数 与 时长 同时生效，
     先到的那个收场——两个数字里总有一个是谎话。默认 "time"：投影出来的比拼要全班同时
     结束，而 同伴挑战 两家从第一天起就只有时钟。 */
  var _setup = { stream: "g3", scope: {}, mode: "cloze", tier: "3", limitBy: "time",
                 qCount: 20, durationS: 300, rainPy: true, rainLives: 5, acc: null };
  /* 限时房间要给足词，否则序列先走完就变成了第二个上限——正是这次要消灭的东西。
     40 是 同伴挑战 两家用的数（8 分钟也答不完），这里给到 80。 */
  var ARENA_TIME_POOL = 80;

  function arenaCode() { var s = ""; for (var i = 0; i < 6; i++) s += ARENA_ALPHABET[Math.floor(Math.random() * ARENA_ALPHABET.length)]; return s; }
  /* ⚠️ THE PIER'S FILE IS A DIFFERENT SHAPE ENTIRELY — a flat array of 156 rows with
     词语/拼音/英文释义/图档/组别/子类, not levels→units→components. It is normalised HERE,
     into the same {units, byKey} the accordion already speaks, so nothing downstream
     (the scope picker, the counts, generateRoom, tryCreate) needs a second code path.
     ⚠️ ONE PSEUDO-LEVEL, 「出发码头」, and the units are the eight 组别. A teacher opening
     a pier room thinks in 动物 / 食物, not in 中三·单元四; mapping 组别 onto `level` and
     子类 onto `unit` would have produced a two-deep accordion whose top level has one
     child in most branches.
     ⚠️ `id` IS THE 词语 ITSELF, matching js/xh.js: the pier has never had word ids
     (store.done is keyed by text, §5), and the room's wordIds must be what the pier
     side can look up. */
  function fetchPierJson() {
    if (_arena.json.xh) return Promise.resolve(_arena.json.xh);
    return fetch("data/xh_v3.json" + ASSET_V).then(function (r) { return r.json(); }).then(function (rows) {
      var units = [], byKey = {}, order = [];
      (rows || []).forEach(function (w) {
        var g = w["组别"] || "其他";
        if (!byKey[g]) { byKey[g] = []; order.push(g); }
        byKey[g].push({ id: w["词语"], w: w["词语"], py: w["拼音"], en: w["英文释义"],
                        pic: w["图档"], grp: g });
      });
      order.forEach(function (g) {
        units.push({ key: g, level: "出发码头", unit: g, theme: "", count: byKey[g].length });
      });
      _arena.json.xh = { units: units, byKey: byKey };
      return _arena.json.xh;
    });
  }
  function fetchStreamJson(stream) {
    if (isPierStream(stream)) return fetchPierJson();
    if (_arena.json[stream]) return Promise.resolve(_arena.json[stream]);
    return fetch("data/" + stream + ".json" + ASSET_V).then(function (r) { return r.json(); }).then(function (j) {
      var units = [], byKey = {};
      j.levels.forEach(function (lv) {
        lv.units.forEach(function (u) {
          var key = lv.level + "·" + u.unit, words = [];
          u.components.forEach(function (c) { c.words.forEach(function (w) { words.push(w); }); });
          /* level/unit/theme are split out for the accordion: the student side
             shows 单元一 + its 主题 + 词数 on the chip, and 「新同学 新鲜事」is how a
             teacher actually recognises the unit — 中三·单元四 is not. */
          units.push({ key: key, level: lv.level, unit: u.unit, theme: u.theme || "", count: words.length });
          byKey[key] = words;
        });
      });
      _arena.json[stream] = { units: units, byKey: byKey }; return _arena.json[stream];
    });
  }

  /* ================= 意见反馈工单 (2026-08-14) =================================
     A ticket queue, not a dump: every row can be moved through
     待处理 → 处理中 → 已解决 / 不处理, carries a developer note, and shows who
     sent it (nickname · class · school · uid) plus the app version and page it
     came from — the context you need to reproduce a bug without asking.
     Abuse: the daily ceiling is enforced structurally by the ticket ID in
     firestore.rules (default 20/day). 额度 below writes feedbackQuota/{uid} —
     raise it for a prolific reporter, set it to 0 to shut off an abuser. One
     control, not a separate ban list. */
  /* default is "todo" (待处理 + 处理中), NOT "open" — the first draft defaulted
     to "open" and brand-new tickets were invisible the moment they arrived,
     which is exactly the queue you most need to see. */
  var _fb = null, _fbStatus = "todo", _fbType = "";
  var FB_ST = { "new": "待处理", open: "处理中", resolved: "已解决", wontfix: "不处理" };
  var FB_TY = { content: "📖 词语内容", bug: "🐞 程序出错", idea: "💡 建议", other: "❓ 其他" };
  function fbWhen(t) {
    if (!t || !t.toDate) return "—";
    var d = t.toDate();
    return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2) +
      " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function fbRefreshBadge() {
    if (!_fb) return;
    var n = _fb.filter(function (r) { return r.status === "new"; }).length;
    var b = el("fbBadge"); if (!b) return;
    b.textContent = n; b.style.display = n ? "" : "none";
  }
  function renderFeedback(panel) {
    if (!_fb) {
      panel.innerHTML = '<div class="card hint">读取反馈…</div>';
      /* teacher.html is standalone and never loads firebase-init.js — it talks to
         its own `db` handle, same as every other tab here. */
      db.collection("feedback").limit(300).get().then(function (qs) {
        var rows = []; qs.forEach(function (d) { rows.push(Object.assign({ id: d.id }, d.data())); });
        _fb = rows; fbRefreshBadge(); renderFeedback(el("panel"));
      }).catch(function (e) {
        panel.innerHTML = '<div class="card hint">读取失败：' + esc(e.code || e.message) +
          '<br>请确认 firestore.rules 里的 feedback 区块已发布。</div>';
      });
      return;
    }
    /* newest first, client-side: createdAt is a serverTimestamp and is briefly
       null on a just-written doc, so an orderBy query would hide the newest. */
    var rows = _fb.slice().sort(function (a, b) {
      var x = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
      var y = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
      return y - x;
    });
    var counts = { all: rows.length, "new": 0, open: 0, resolved: 0, wontfix: 0 };
    rows.forEach(function (r) { if (counts[r.status] !== undefined) counts[r.status]++; });
    var shown = rows.filter(function (r) {
      if (_fbStatus === "todo" && (r.status === "resolved" || r.status === "wontfix")) return false;
      if (_fbStatus !== "todo" && _fbStatus !== "all" && r.status !== _fbStatus) return false;
      if (_fbType && r.type !== _fbType) return false;
      return true;
    });
    var canBan = _me && _me.role === "hod";

    var chips = [["todo", "未处理 " + (counts["new"] + counts.open)], ["new", "待处理 " + counts["new"]],
                 ["open", "处理中 " + counts.open], ["resolved", "已解决 " + counts.resolved],
                 ["wontfix", "不处理 " + counts.wontfix], ["all", "全部 " + counts.all]];
    var tychips = [["", "全部类型"]].concat(Object.keys(FB_TY).map(function (k) { return [k, FB_TY[k]]; }));

    var html = '<div class="card"><h2 style="margin-top:0">意见反馈 · 工单</h2>' +
      '<div class="fb-filters">' +
      chips.map(function (c) {
        return '<button class="fchip-btn' + (_fbStatus === c[0] ? " on" : "") + '" data-fs="' + c[0] + '">' + c[1] + '</button>';
      }).join("") + '</div>' +
      '<div class="fb-filters">' +
      tychips.map(function (c) {
        return '<button class="fchip-btn' + (_fbType === c[0] ? " on" : "") + '" data-ft="' + c[0] + '">' + c[1] + '</button>';
      }).join("") + '</div>' +
      '<div class="row" style="margin-top:8px"><button class="btn ghost" id="fbReload">重新读取</button></div></div>';

    if (!shown.length) {
      html += '<div class="card hint">这个筛选下没有工单。</div>';
    } else {
      html += shown.map(function (r) {
        return '<div class="card fb-ticket" data-id="' + esc(r.id) + '">' +
          '<div class="fb-top">' +
            '<span class="fb-pill s-' + esc(r.status || "new") + '">' + esc(FB_ST[r.status] || r.status || "待处理") + '</span>' +
            '<span class="fb-pill ty">' + esc(FB_TY[r.type] || r.type || "") + '</span>' +
            '<span class="fb-when">' + esc(fbWhen(r.createdAt)) + '</span>' +
          '</div>' +
          (r.ctx ? '<div class="fb-ctx-line">📍 ' + esc(r.ctx) + '</div>' : "") +
          '<div class="fb-text">' + esc(r.text || "") + '</div>' +
          '<div class="fb-meta">' +
            esc(r.nickname || "（无昵称）") +
            (r.mtlClass ? " · " + esc(r.mtlClass) : "") +
            (r.school ? " · " + esc(canonSchool(r.school)) : "") +
            ' · <code title="' + esc(r.uid || "") + '">' + esc((r.uid || "").slice(0, 8)) + '</code>' +
            (r.stream ? " · " + esc(r.stream.toUpperCase()) : "") +
            (r.page ? " · " + esc(r.page) : "") +
            (r.appV ? " · " + esc(r.appV) : "") +
          '</div>' +
          (r.ua ? '<details class="fb-ua"><summary>设备信息</summary><code>' + esc(r.ua) + '</code></details>' : "") +
          '<input class="fb-note" data-note="' + esc(r.id) + '" placeholder="开发笔记（学生看不到）" value="' + esc(r.note || "") + '">' +
          '<div class="fb-actions">' +
            '<button class="btn ghost" data-set="open">处理中</button>' +
            '<button class="btn" data-set="resolved">标记已解决</button>' +
            '<button class="btn ghost" data-set="wontfix">不处理</button>' +
            '<button class="btn ghost" data-set="new">退回待处理</button>' +
            (canBan ? '<button class="btn ghost fb-ban" data-quota="' + esc(r.uid || "") + '">额度…</button>' : "") +
          '</div>' +
          (r.handledBy ? '<div class="fb-handled">最近处理：' + esc(r.handledBy) + ' · ' + esc(fbWhen(r.handledAt)) + '</div>' : "") +
          '</div>';
      }).join("");
    }
    panel.innerHTML = html;

    Array.prototype.forEach.call(panel.querySelectorAll("[data-fs]"), function (b) {
      b.onclick = function () { _fbStatus = b.getAttribute("data-fs"); renderFeedback(el("panel")); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll("[data-ft]"), function (b) {
      b.onclick = function () { _fbType = b.getAttribute("data-ft"); renderFeedback(el("panel")); };
    });
    el("fbReload").onclick = function () { _fb = null; renderFeedback(el("panel")); };
    Array.prototype.forEach.call(panel.querySelectorAll(".fb-ticket"), function (card) {
      var id = card.getAttribute("data-id");
      Array.prototype.forEach.call(card.querySelectorAll("[data-set]"), function (b) {
        b.onclick = function () {
          var st = b.getAttribute("data-set");
          var note = (card.querySelector("[data-note]") || {}).value || "";
          b.disabled = true; b.textContent = "…";
          db.collection("feedback").doc(id).update({
            status: st, note: note, handledBy: (_me && _me.name) || "",
            handledAt: firebase.firestore.FieldValue.serverTimestamp()
          }).then(function () {
            var row = _fb.filter(function (x) { return x.id === id; })[0];
            if (row) { row.status = st; row.note = note; row.handledBy = (_me && _me.name) || ""; }
            fbRefreshBadge(); renderFeedback(el("panel"));
          }).catch(function (e) {
            alert("保存失败：" + (e.code || e.message) + "\n请确认 feedback 规则已发布。");
            b.disabled = false; renderFeedback(el("panel"));
          });
        };
      });
      var q = card.querySelector(".fb-ban");
      if (q) q.onclick = function () {
        var uid = q.getAttribute("data-quota");
        if (!uid) return;
        var v = prompt("这位同学每天可以提交几条反馈？\n\n" +
                       "· 留空 = 恢复默认（20 条）\n" +
                       "· 调高 = 反馈很有用的同学，例如 50\n" +
                       "· 填 0 = 停止接收（学习功能不受影响）", "");
        if (v === null) return;
        var ref = db.collection("feedbackQuota").doc(uid);
        var p = (v.trim() === "")
          ? ref.delete()
          : ref.set({ max: Math.max(0, parseInt(v, 10) || 0),
                      by: (_me && _me.name) || "",
                      at: firebase.firestore.FieldValue.serverTimestamp() });
        p.then(function () { alert(v.trim() === "" ? "已恢复默认额度。" : "已设为每天 " + (parseInt(v, 10) || 0) + " 条。"); })
         .catch(function (e) { alert("操作失败：" + (e.code || e.message)); });
      };
    });
  }

  function renderArena(panel) { if (_arena.code) return renderArenaLive(panel); renderArenaSetup(panel); }

  /* ⟨cs.css .qty*⟩ quantity slider, ported from cs.js qtySlider/wireQtySlider.
     The range is indexed over the ALLOWED values (0..n-1, step 1), so a drag can
     only ever land on a legal value and the stops stay evenly spaced even when
     the values are not (180/300/480/600/900). */
  function qtySlider(id, label, values, cur, fmt) {
    var i = values.indexOf(cur); if (i === -1) i = 0;
    var ticks = ""; for (var k = 0; k < values.length; k++) ticks += "<i></i>";
    return '<div class="qty"><div class="qty-lab">' + esc(label) + '</div>' +
      '<b class="qty-val" id="' + id + 'Val">' + esc(fmt(cur)) + '</b>' +
      '<div class="qty-track"><div class="qty-ticks" aria-hidden="true">' + ticks + '</div>' +
      '<input type="range" class="qty-range" id="' + id + '" min="0" max="' + (values.length - 1) +
      '" step="1" value="' + i + '" aria-label="' + esc(label) + '"></div></div>';
  }
  function wireQtySlider(id, values, fmt, onPick) {
    var r = el(id), out = el(id + "Val"); if (!r) return;
    r.oninput = function () { var v = values[parseInt(r.value, 10)]; if (out) out.textContent = fmt(v); onPick(v); };
  }

  /* ---------- 出题设置 ----------
     Rebuilt 2026-08-17 to select the way the STUDENT home selects (owner: 「the
     interface is super cluttered, make it like the student interface」). What
     changed and why it was cluttered:
     · 单元范围 was 29 bare checkboxes in one flat wall — the student side has had
       an exclusive accordion by 年级 with gold unit chips since 2026-08-14, and the
       unit's 主题 (which is how a teacher recognises it) was not shown at all.
     · every control was a stacked <label> + widget in one 1700px-wide column;
       now it is two columns (哪些词 left · 怎么考 right) like the student home.
     · 题数 / 时长 were <select> dropdowns — the only controls whose choices you
       had to open before you could see them. Sliders, same as the student's.
     ⚠️ Mode / 难度 / 词雨 changes DO NOT re-render the card: syncRight() flips
     classes in place. A full re-render would rebuild the scope box and throw away
     both its scroll position and the open 年级. */
  function renderArenaSetup(panel) {
    var TIERS = [["2", "⭐", "两个选项"], ["3", "⭐⭐", "三个选项"],
                 ["4", "⭐⭐⭐", "四个选项"], ["type", "⭐⭐⭐⭐", "打字输入"]];
    panel.innerHTML = '<div class="card"><h2 style="margin-top:0">' + arenaName(_setup.stream) + ' · 出题设置</h2>' +
      '<div class="hint">选好范围与模式后生成擂台码，写在白板上让学生加入。全班答同一套题（顺序已冻结），公平比拼。' +
      arenaRewardHint(_setup.stream) + '</div>' +
      '<div class="ar-grid">' +
      /* left column = 哪些词 */
      '<div class="ar-col">' +
      '<div class="ar-step"><span class="n">①</span>科目</div>' +
      '<div class="ar-tiles" id="arStream"></div>' +
      '<div class="ar-step"><span class="n">②</span>单元范围 · 可多选</div>' +
      '<div id="arScope" class="hint">载入词库…</div>' +
      '</div>' +
      /* right column = 怎么考 */
      '<div class="ar-col">' +
      '<div class="ar-step"><span class="n">③</span>模式</div>' +
      '<div class="ar-tiles m3" id="arMode"></div>' +
      /* §2.2: each mode's own settings live in an inset panel that appears only
         when that mode is picked — never all five modes' controls at once.
         ⚠️ Unnumbered: it is a detail of ③, not a fifth step (§7). */
      '<div class="cfg-sub" id="arTierRow"><div class="cfg-sub-t">填空挑战设置</div>' +
        '<div class="qty-lab" style="margin-top:9px">难度</div><div class="ar-tiles" id="arTier">' +
        TIERS.map(function (t) {
          return '<button class="ar-tile arT" data-t="' + t[0] + '"><b>' + t[1] + '</b><span>' + t[2] + '</span></button>';
        }).join("") + '</div></div>' +
      '<div class="cfg-sub" id="arRainRow" style="display:none"><div class="cfg-sub-t">词雨灵露设置</div>' +
        /* 2026-08-14: 下落速度 / 速度模式 removed. 词雨 is progressive-only now —
           one course for everyone, ramping with time and restarting each round —
           so there is nothing left to choose. */
        '<div class="hint">下落速度由系统统一控制：每局都从最慢开始，随时间逐渐加快，全班同一套节奏。</div>' +
        '<div class="qty-lab" style="margin-top:9px">拼音辅助</div><div class="ar-tiles" id="arRp">' +
        '<button class="ar-tile arRp" data-py="1"><b>显示拼音</b></button>' +
        '<button class="ar-tile arRp" data-py="0"><b>隐藏拼音</b></button></div>' +
        '<div class="qty-lab" style="margin-top:9px">生命</div><div class="ar-tiles" id="arRl">' +
        [[0, "时间制", "只按时长结束"], [3, "3 命", ""], [5, "5 命", ""], [8, "8 命", ""]].map(function (o) {
          return '<button class="ar-tile arRl" data-l="' + o[0] + '"><b>' + o[1] + '</b>' +
            (o[2] ? '<span>' + o[2] + '</span>' : "") + '</button>';
        }).join("") + '</div></div>' +
      /* ④ 二选一，不再两个上限同时挂着。滑杆只出现被选中的那一根：两根都在、
         只有一根算数，读起来就是「另一根设了也没用」。 */
      '<div class="ar-step"><span class="n">④</span>结束条件 · 二选一</div>' +
      '<div class="ar-tiles" id="arLimit">' +
      '<button class="ar-tile arL" data-l="time"><b>按时长</b><span>时间一到全班同时收场</span></button>' +
      '<button class="ar-tile arL" data-l="qty"><b>按题数</b><span>答完这些题就结束，不计时</span></button>' +
      '</div>' +
      '<div class="hint" id="arLimitNote" style="display:none;margin-top:8px">' +
      '词雨灵露 的词是不断落下的，没有「一题」可数，所以只能按时长结束。</div>' +
      '<div class="ar-qtys">' +
      '<div id="arDurRow">' +
      qtySlider("arDur", "时长", ARENA_DURS, _setup.durationS, function (n) { return (n / 60) + " 分钟"; }) +
      '</div><div id="arQRow">' +
      qtySlider("arQ", "题数", ARENA_QCOUNTS, _setup.qCount, function (n) { return n + " 题"; }) +
      '</div></div></div>' +
      '<div class="ar-go"><button class="btn primary" id="arGen">生成擂台码 ›</button>' +
      '<div class="msg" id="arMsg"></div></div>' +
      '</div></div>';

    el("arStream").innerHTML = ARENA_STREAMS.map(function (s) {
      return '<button class="ar-tile arS' + (s === _setup.stream ? " on" : "") + '" data-s="' + s + '">' +
        '<b>' + STREAM_LABEL[s] + '</b><span>' + STREAM_SUB[s] + '</span></button>';
    }).join("");
    Array.prototype.forEach.call(el("arStream").querySelectorAll(".arS"), function (b) {
      b.onclick = function () { _setup.stream = b.getAttribute("data-s"); _setup.scope = {}; _setup.acc = null; renderArenaSetup(panel); };
    });
    /* ⚠️ Keep _setup.mode LEGAL for the family before painting the row. Switching to
       码头 while 填空挑战 was selected would otherwise leave a mode selected that has no
       tile — the row looks like nothing is chosen and 生成擂台码 builds a room the pier
       cannot render. Same class of bug as arena's own two mode lists (§18w). */
    if (arenaModesFor(_setup.stream).indexOf(_setup.mode) === -1) {
      _setup.mode = arenaModesFor(_setup.stream)[0];
    }
    el("arMode").innerHTML = arenaModesFor(_setup.stream).map(function (k) {
      return '<button class="ar-tile arM" data-m="' + k + '"><b>' + ARENA_MODE_ZH[k] + '</b>' +
        '<span>' + ARENA_MODE_SUB[k] + '</span></button>';
    }).join("");

    /* one repaint for everything on the right: the picked tiles and which inset
       panel is showing. Called on load and after every click over there. */
    function syncRight() {
      function mark(sel, isOn) {
        Array.prototype.forEach.call(panel.querySelectorAll(sel), function (b) {
          b.classList.toggle("on", isOn(b));
        });
      }
      mark(".arM", function (b) { return b.getAttribute("data-m") === _setup.mode; });
      mark(".arT", function (b) { return b.getAttribute("data-t") === _setup.tier; });
      mark(".arRp", function (b) { return (b.getAttribute("data-py") === "1") === !!_setup.rainPy; });
      mark(".arRl", function (b) { return parseInt(b.getAttribute("data-l"), 10) === _setup.rainLives; });
      /* ⚠️ both rows are mountain-only and stay hidden on 码头: ⭐档 belongs to 填空挑战
         and the 词雨 options to a game the pier does not have. They are keyed on the MODE,
         and no pier mode is cloze/rain, so this already behaves — the note is here so the
         next person does not "fix" it by adding a stream check. */
      el("arTierRow").style.display = _setup.mode === "cloze" ? "" : "none";
      el("arRainRow").style.display = _setup.mode === "rain" ? "" : "none";
      /* ⚠️ 词雨灵露 没有题数可数（词是循环落下的），所以它被钉在 按时长 上——
         和 arena.js 里 rain 一路读 durationS 是同一件事，两边不许分叉。 */
      var rain = _setup.mode === "rain";
      if (rain) _setup.limitBy = "time";
      mark(".arL", function (b) { return b.getAttribute("data-l") === _setup.limitBy; });
      Array.prototype.forEach.call(panel.querySelectorAll(".arL"), function (b) {
        b.disabled = rain && b.getAttribute("data-l") === "qty";
        b.style.opacity = b.disabled ? ".45" : "";
      });
      el("arLimitNote").style.display = rain ? "" : "none";
      el("arQRow").style.display = _setup.limitBy === "qty" ? "" : "none";
      el("arDurRow").style.display = _setup.limitBy === "qty" ? "none" : "";
    }
    Array.prototype.forEach.call(panel.querySelectorAll(".arM"), function (b) {
      b.onclick = function () { _setup.mode = b.getAttribute("data-m"); syncRight(); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".arT"), function (b) {
      b.onclick = function () { _setup.tier = b.getAttribute("data-t"); syncRight(); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".arRp"), function (b) {
      b.onclick = function () { _setup.rainPy = b.getAttribute("data-py") === "1"; syncRight(); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".arRl"), function (b) {
      b.onclick = function () { _setup.rainLives = parseInt(b.getAttribute("data-l"), 10); syncRight(); };
    });
    Array.prototype.forEach.call(panel.querySelectorAll(".arL"), function (b) {
      b.onclick = function () { _setup.limitBy = b.getAttribute("data-l"); syncRight(); };
    });
    syncRight();

    wireQtySlider("arQ", ARENA_QCOUNTS, function (n) { return n + " 题"; }, function (n) { _setup.qCount = n; });
    wireQtySlider("arDur", ARENA_DURS, function (n) { return (n / 60) + " 分钟"; }, function (n) { _setup.durationS = n; });

    fetchStreamJson(_setup.stream).then(function (data) {
      var sc = el("arScope"); sc.className = "";
      var byLevel = {}, levels = [];
      data.units.forEach(function (u) {
        if (!byLevel[u.level]) { byLevel[u.level] = []; levels.push(u.level); }
        byLevel[u.level].push(u);
      });
      /* ⚠️ The student card defaults to ALL folded (a first-timer sees four short
         rows). Here the first 年级 opens, because a teacher arrives knowing which
         unit today's lesson is on and an all-folded box would show zero units. */
      if (!_setup.acc || !byLevel[_setup.acc]) _setup.acc = levels[0];
      sc.innerHTML = '<div class="scope-box" id="arScopeBox">' +
        '<div class="scope-top"><div class="scope-sum" id="arSum"></div>' +
        '<div class="scope-acts"><button class="unit" id="arAll"><b>全选</b></button>' +
        '<button class="unit" id="arNone"><b>清空</b></button></div></div>' +
        levels.map(function (lv) {
          var open = _setup.acc === lv;
          return '<button class="scope-acc' + (open ? " open" : "") + '" data-lv="' + esc(lv) + '">' +
            esc(lv) + '<span class="cnt" data-cnt="' + esc(lv) + '"></span><span class="chev">›</span></button>' +
            '<div class="units' + (open ? "" : " collapsed") + '" data-lvbody="' + esc(lv) + '">' +
            byLevel[lv].map(function (u) {
              return '<button class="unit' + (_setup.scope[u.key] ? " on" : "") + '" data-k="' + esc(u.key) + '">' +
                '<b>' + esc(u.unit) + '</b>' +
                (u.theme ? '<span class="unit-theme">' + esc(u.theme) + '</span>' : "") +
                '<span class="unit-n">' + u.count + '词</span></button>';
            }).join("") + '</div>';
        }).join("") + '</div>';

      function updateSum() {
        var n = 0, picked = 0;
        data.units.forEach(function (u) { if (_setup.scope[u.key]) { picked++; n += u.count; } });
        el("arSum").textContent = "已选 " + picked + " 个" + scopeNoun(_setup.stream) +
          " · 共 " + n + " 词";
        levels.forEach(function (lv) {
          var c = sc.querySelector('.cnt[data-cnt="' + lv + '"]'); if (!c) return;
          var sel = byLevel[lv].filter(function (u) { return _setup.scope[u.key]; }).length;
          c.textContent = sel ? "· 已选 " + sel + "/" + byLevel[lv].length
                              : "· " + byLevel[lv].length + " 个" + scopeNoun(_setup.stream);
        });
      }
      /* ⚠️ Toggling a unit flips a class and updates the counts — it does NOT
         re-render. Rebuilding the box on every pick scrolled it back to the top,
         and picking six units in a row is the normal case. */
      Array.prototype.forEach.call(sc.querySelectorAll(".unit[data-k]"), function (b) {
        b.onclick = function () {
          var k = b.getAttribute("data-k");
          if (_setup.scope[k]) { delete _setup.scope[k]; b.classList.remove("on"); }
          else { _setup.scope[k] = 1; b.classList.add("on"); }
          updateSum();
        };
      });
      /* exclusive accordion: at most one 年级 open, same as the student card.
         Folding never changes the selection, only what is visible. */
      Array.prototype.forEach.call(sc.querySelectorAll(".scope-acc"), function (b) {
        b.onclick = function () {
          var lv = b.getAttribute("data-lv");
          _setup.acc = (_setup.acc === lv) ? null : lv;
          Array.prototype.forEach.call(sc.querySelectorAll(".scope-acc"), function (h) {
            h.classList.toggle("open", h.getAttribute("data-lv") === _setup.acc);
          });
          Array.prototype.forEach.call(sc.querySelectorAll(".units"), function (u) {
            u.classList.toggle("collapsed", u.getAttribute("data-lvbody") !== _setup.acc);
          });
        };
      });
      el("arAll").onclick = function () {
        data.units.forEach(function (u) { _setup.scope[u.key] = 1; });
        Array.prototype.forEach.call(sc.querySelectorAll(".unit[data-k]"), function (b) { b.classList.add("on"); });
        updateSum();
      };
      el("arNone").onclick = function () {
        _setup.scope = {};
        Array.prototype.forEach.call(sc.querySelectorAll(".unit[data-k]"), function (b) { b.classList.remove("on"); });
        updateSum();
      };
      updateSum();
    }).catch(function () { el("arScope").textContent = "词库载入失败。"; });
    el("arGen").onclick = function () { generateRoom(panel); };
  }

  function generateRoom(panel) {
    var m = el("arMsg"); m.className = "msg";
    if (!Object.keys(_setup.scope).length) {
      m.className = "msg bad";
      m.textContent = "请至少选择一个" + scopeNoun(_setup.stream) + "。"; return;
    }
    m.textContent = "生成中…";
    fetchStreamJson(_setup.stream).then(function (data) {
      var pool = [];
      Object.keys(_setup.scope).forEach(function (k) { (data.byKey[k] || []).forEach(function (w) { pool.push(w); }); });
      if (_setup.mode === "cloze") pool = pool.filter(function (w) { return w.cloze && w.cloze.indexOf("__") !== -1; });
      if (_setup.mode === "rain") pool = pool.filter(function (w) { return w.w && w.w.length <= 4; });
      /* ⚠️ 看图识词 NEEDS A PICTURE, and the pier has a whole group without one: 数字 is
         deliberately artless (§5 — drawing three apples to teach 三 teaches apples). Let
         one through and the room shows an empty frame with four options under it, which
         is §4.4's silent failure in its purest form. */
      if (_setup.mode === "pic") pool = pool.filter(function (w) { return !!w.pic; });
      var minNeed = _setup.mode === "rain" ? 8 : 4;
      if (pool.length < minNeed) { m.className = "msg bad"; m.textContent = "所选范围可用词太少（本模式需要至少 " + minNeed + " 个）。"; return; }
      for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
      /* ⚠️ 按时长 的房间要拿走范围内尽可能多的词（上限 ARENA_TIME_POOL）：
         只发 20 个，快的学生第 20 题就收场——那就是把题数偷偷变回第二个上限。
         按题数 的房间恰好发那么多题。 */
      var q = _setup.limitBy === "qty" ? Math.min(_setup.qCount, pool.length)
                                       : Math.min(ARENA_TIME_POOL, pool.length);
      tryCreate(pool.slice(0, q).map(function (w) { return w.id; }), q, 0, m, panel);
    });
  }
  function tryCreate(wordIds, q, attempt, m, panel) {
    if (attempt >= 3) { m.className = "msg bad"; m.textContent = "生成失败，请重试。"; return; }
    var code = arenaCode(), doc = db.collection("rooms").doc(code);
    doc.get().then(function (snap) {
      if (snap.exists) return tryCreate(wordIds, q, attempt + 1, m, panel);
      var roomDoc = {
        hostUid: auth.currentUser.uid, hostName: (_me && _me.name) || "老师", school: (_me && _me.school) || "",
        stream: _setup.stream, mode: _setup.mode, tier: _setup.tier, scope: Object.keys(_setup.scope),
        wordIds: wordIds, qCount: q, limitBy: _setup.limitBy, status: "lobby",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(), startedAt: null,
        expiresAt: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 6 * 3600 * 1000)), playerCount: 0
      };
      /* ⚠️ 只写生效的那一个上限，不写另一个：一个躺在文档里不生效的 durationS，
         下一个读这份文档的人（或者一个旧版 arena.js）会当真。 */
      if (_setup.limitBy === "qty") delete roomDoc.durationS;
      else roomDoc.durationS = _setup.durationS;
      if (_setup.mode === "rain") {
        /* no speed/ramp keys any more: arena.js uses its own progressive ramp,
           the same one the solo game uses. Old rooms carrying them are ignored. */
        roomDoc.gameCfg = { py: _setup.rainPy, lives: _setup.rainLives };
      }
      return doc.set(roomDoc).then(function () { _arena.code = code; _arena.players = []; _arena.room = null; subscribeArena(); renderArena(panel); });
    }).catch(function (e) { m.className = "msg bad"; m.textContent = "创建失败：" + (e.code || e.message) + "（请确认 rooms 规则已发布）。"; });
  }

  function subscribeArena() {
    if (_arena.unsub) _arena.unsub();
    if (_arena.punsub) _arena.punsub();
    _arena.unsub = db.collection("rooms").doc(_arena.code).onSnapshot(function (snap) {
      _arena.room = snap.exists ? snap.data() : null;
      if (_tab === "arena") renderArenaLive(el("panel"));
    });
    _arena.punsub = db.collection("rooms").doc(_arena.code).collection("players").onSnapshot(function (qs) {
      var rows = []; qs.forEach(function (d) { rows.push(Object.assign({ uid: d.id }, d.data())); });
      _arena.players = rows;
      // keep the room's playerCount current so student lobbies show a live count
      // (only the host may write the room doc; write only on change)
      var room = _arena.room || {};
      if ((room.playerCount || 0) !== rows.length && room.status !== "ended") {
        db.collection("rooms").doc(_arena.code).set({ playerCount: rows.length }, { merge: true }).catch(function () {});
      }
      if (_tab === "arena") renderArenaLive(el("panel"));
    });
  }

  function statusZh(s) { return s === "running" ? "进行中" : s === "ended" ? "已结束" : "等待开始"; }
  function arenaRemaining() {
    var room = _arena.room || {};
    if (room.limitBy === "qty") return null;      // 按题数 的房间没有钟，别印一个 0s
    if (room.status !== "running" || !room.startedAt || !room.startedAt.toMillis) return null;
    return Math.max(0, Math.round((room.startedAt.toMillis() + (room.durationS || 0) * 1000 - Date.now()) / 1000));
  }
  function renderArenaLive(panel) {
    var room = _arena.room || {};
    var rows = _arena.players.slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
    var status = room.status || "lobby", rem = arenaRemaining();
    panel.innerHTML = '<div class="card arena-live" id="arenaCard">' +
      '<div class="row" style="align-items:center"><h2 style="margin:0">' + arenaName(room.stream || _setup.stream) + '</h2>' +
      '<span class="hint" style="margin-left:auto">' + (STREAM_LABEL[room.stream] || "") + ' · ' + (ARENA_MODE_ZH[room.mode] || "") + ' · ' +
      (room.limitBy === "qty" ? (room.qCount || "") + ' 题'
                              : Math.round((room.durationS || 0) / 60) + ' 分钟') + '</span></div>' +
      '<div class="arena-code">' + esc(_arena.code) + '</div>' +
      '<div class="row" style="justify-content:center;font-size:16px">👥 <b id="arPc">' + rows.length + '</b> 人 · <span id="arSt">' + statusZh(status) + '</span>' + (rem != null ? ' · ⏱ <b id="arRem">' + rem + 's</b>' : '') + '</div>' +
      '<div class="scroll" style="margin-top:12px"><table><thead><tr><th>#</th><th></th><th>昵称</th><th>班级</th><th>答对/已答</th><th>得分</th></tr></thead><tbody>' +
      /* ⚠️ r.av is the avatar FILE PATH published by arena.js — this page has no
         avatar catalogue, so an id would be unusable here. Missing/old rows just
         show 👤 rather than a broken image. */
      (rows.map(function (r, i) { return '<tr><td>' + (i + 1) + '</td>' +
        '<td>' + (r.av ? '<img class="ar-av" src="' + esc(r.av) + '" alt="" onerror="this.style.display=\'none\'">' : '<span class="ar-av none">👤</span>') + '</td>' +
        '<td>' + esc(r.nickname || "") + (r.late ? " ⏱" : "") + '</td><td>' + esc(r.mtlClass || "未填班级") + '</td><td>' + (r.correct || 0) + '/' + (r.answered || 0) + '</td><td><b>' + (r.score || 0) + '</b></td></tr>'; }).join("") || '<tr><td colspan="6" class="hint">等待学生加入…</td></tr>') +
      '</tbody></table></div>' +
      '<div class="row" style="margin-top:14px">' +
      (status === "lobby" ? '<button class="btn primary" id="arStart">开始</button>' : '') +
      (status !== "ended" ? '<button class="btn" id="arEnd">结束</button>' : '') +
      '<button class="btn" id="arCsv">导出CSV</button><button class="btn" id="arFs">全屏</button>' +
      '<button class="btn" id="arClose">关闭这场</button></div><div class="msg" id="arLiveMsg"></div></div>';
    var b;
    if ((b = el("arStart"))) b.onclick = startArena;
    if ((b = el("arEnd"))) b.onclick = endArena;
    el("arCsv").onclick = exportArenaCsv;
    el("arFs").onclick = function () { var c = el("arenaCard"); if (c && c.requestFullscreen) c.requestFullscreen().catch(function () {}); };
    el("arClose").onclick = closeArena;
    /* 颁奖台：一结束就出现在投影上，和学生自己屏幕上的那一幕是同一个（owner）。
       ⚠️ 只在 ended 时画，而且**每场只画一次** —— renderArena 会随每次 snapshot
       重跑，不加这个闸门的话彩带会在老师每动一下时重新放一遍。 */
    if (status === "ended" && window.WSPodium && rows.length && _arena.podiumFor !== _arena.code) {
      _arena.podiumFor = _arena.code;
      _arena.stopPodium = window.WSPodium.show(rows.slice(0, 3).map(function (r) {
        return { uid: r.uid, name: r.nickname || "无名", av: r.av || "", score: r.score || 0 };
      }), { unit: "分", title: "🏆 本场前三" });
    }
    if (_arena.tick) clearInterval(_arena.tick);
    if (status === "running") _arena.tick = setInterval(function () {
      var r = arenaRemaining(), t = el("arRem"); if (t && r != null) t.textContent = r + "s";
    }, 1000);
  }
  function startArena() {
    db.collection("rooms").doc(_arena.code).set({ status: "running", startedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
      .catch(function (e) { var m = el("arLiveMsg"); if (m) { m.className = "msg bad"; m.textContent = "开始失败：" + (e.code || e.message); } });
  }
  function endArena() { db.collection("rooms").doc(_arena.code).set({ status: "ended" }, { merge: true }).catch(function () {}); }
  function closeArena() {
    var code = _arena.code;
    if (_arena.unsub) _arena.unsub(); if (_arena.punsub) _arena.punsub(); if (_arena.tick) clearInterval(_arena.tick);
    // best-effort cleanup (TTL removes the room in ~6h but doesn't cascade to players)
    _arena.players.forEach(function (r) { db.collection("rooms").doc(code).collection("players").doc(r.uid).delete().catch(function () {}); });
    db.collection("rooms").doc(code).delete().catch(function () {});
    if (_arena.stopPodium) _arena.stopPodium();
    _arena = { code: null, unsub: null, punsub: null, room: null, players: [], tick: null, json: _arena.json };
    renderArena(el("panel"));
  }
  function exportArenaCsv() {
    var rows = _arena.players.slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
    var csv = "排名,昵称,班级,答对,已答,得分\n" + rows.map(function (r, i) {
      return [i + 1, '"' + (r.nickname || "") + '"', '"' + (r.mtlClass || "") + '"', r.correct || 0, r.answered || 0, r.score || 0].join(",");
    }).join("\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "arena_" + _arena.code + ".csv"; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function renderMod(panel) {
    if (!_me || _me.role !== "hod") { panel.innerHTML = '<div class="card hint">仅 HOD 可处理。</div>'; return; }
    panel.innerHTML =
      '<div class="card"><h2 style="margin-top:0">处理（仅 HOD）</h2>' +
      '<div class="hint">对确认作弊的学生写入一条 moderation 记录。学生下次在该设备联网打开时生效，' +
      '把该科目进度清零。这是社群约束，不是严格封锁：清空浏览器数据会换新 UID、同时丢失全部进度，' +
      '所以规避的代价与被清零相同。</div>' +
      '<label>学生 UID</label><input id="mUid" style="width:100%" placeholder="从「恢复记录」或学生的技术编号获取">' +
      '<div class="row"><div><label>动作</label><select id="mAction"><option value="zero">清零该科目 zero</option></select></div>' +
      '<div><label>科目</label><select id="mStream">' + STREAMS.map(function (s) { return '<option value="' + s + '">' + STREAM_LABEL[s] + '</option>'; }).join("") + '</select></div></div>' +
      '<label>备注</label><input id="mNote" style="width:100%" placeholder="例如：2026-08-12 使用了同学的进度码">' +
      '<div style="margin-top:14px"><button class="btn primary" id="mSave">写入处理记录</button></div>' +
      '<div class="msg" id="mMsg"></div></div>';
    el("mSave").onclick = function () {
      var uid = el("mUid").value.trim();
      var m = el("mMsg");
      if (!uid) { m.className = "msg bad"; m.textContent = "请填写学生 UID。"; return; }
      db.collection("moderation").doc(uid).set({
        action: el("mAction").value, stream: el("mStream").value,
        at: new Date().toISOString(), note: el("mNote").value.trim(),
        by: (_me && _me.name) || ""
      }).then(function () { m.className = "msg ok"; m.textContent = "已写入。学生下次联网打开该科目时生效。"; })
        .catch(function (e) { m.className = "msg bad"; m.textContent = "写入失败：" + (e.code || e.message); });
    };
  }
})();
</script>
</body>
</html>
