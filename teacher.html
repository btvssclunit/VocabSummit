<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师后台 · 词山学海 Vocab Summit · 百德中学</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* teacher.html is a STANDALONE page: it never loads app.js / profile.js.
   Real Firebase Email/Password accounts + the teachers/{uid} allowlist are the
   only boundary (the repo is public, so a client-side password is not one). */
:root{--sky:#DFEDF7;--ink:#243B4A;--ink-soft:#5A7080;--sea:#2E6391;--deep:#1F4A70;
  --gold:#E3A63C;--green:#3F704F;--line:#C9DCEA}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans SC",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#EAF3FA,#D3E4F1);min-height:100vh}
h1,h2{font-family:"Noto Serif SC",serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{font-size:22px;margin:0;letter-spacing:.05em}
.top .sub{font-size:12.5px;color:var(--ink-soft)}
.spacer{margin-left:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;
  box-shadow:0 6px 20px rgba(20,50,80,.06);margin-bottom:16px}
.btn{border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:14px;
  background:#fff;color:var(--sea);cursor:pointer;font-weight:600}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#3A2A08}
.btn:disabled{opacity:.5;cursor:default}
input,select{border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;
  font-family:inherit;color:var(--ink);background:#F7FAFC}
label{font-size:12.5px;font-weight:700;color:#3A5A70;display:block;margin:8px 0 4px;letter-spacing:.05em}
.signin{max-width:380px;margin:8vh auto}
.msg{font-size:13px;margin-top:10px;min-height:18px}
.msg.bad{color:#9B3B2E}.msg.ok{color:#256242}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:13.5px;
  background:#fff;color:var(--ink-soft);cursor:pointer}
.tab.on{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:700}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{flex:1;min-width:150px;background:#F1F6FB;border:1px solid #DBE7F1;border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--ink-soft)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #E7EFF6;white-space:nowrap}
th{color:#3A5A70;cursor:pointer;user-select:none;font-size:12px;letter-spacing:.04em}
.scroll{overflow-x:auto}
.flag-bad{background:#FBEDE9}
.arena-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:900;font-size:min(18vw,120px);
  letter-spacing:.1em;text-align:center;color:#243B4A;margin:12px 0;background:#F1F6FB;
  border:3px solid #D9A72B;border-radius:16px;padding:10px}
.arena-live table td{font-size:15px;padding:9px 10px}
.arena-live:fullscreen{background:#fff;padding:28px;overflow:auto}
.arena-live:fullscreen .arena-code{font-size:min(22vw,180px)}
.hint{font-size:12px;color:var(--ink-soft);line-height:1.7}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:#EAF1F8;color:#3A5A70}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>教师后台</h1>
    <span class="sub">词山学海 Vocab Summit · 百德中学</span>
    <span class="spacer"></span>
    <span id="whoami" class="sub"></span>
    <button class="btn" id="signOutBtn" style="display:none">退出登录</button>
  </div>

  <!-- sign in / register -->
  <div class="card signin" id="signinCard">
    <div class="tabs" style="margin-bottom:14px">
      <button class="tab on" id="tabLogin">登录 Login</button>
      <button class="tab" id="tabRegister">教师注册 Register</button>
    </div>

    <div id="loginPane">
      <div class="hint">已获批准的教师登录。学生无需登录，也无法进入此页。</div>
      <label>电邮 Email</label>
      <input type="email" id="email" style="width:100%" autocomplete="username">
      <label>密码 Password</label>
      <input type="password" id="password" style="width:100%" autocomplete="current-password">
      <div style="margin-top:14px;display:flex;gap:10px">
        <button class="btn primary" id="signInBtn">登录</button>
        <button class="btn" id="resetBtn">忘记密码</button>
      </div>
    </div>

    <div id="registerPane" style="display:none">
      <div class="hint">百德中学华文教师注册。提交后需 HOD 审批，通过后即可登录使用。</div>
      <label>姓名 Name</label>
      <input type="text" id="rName" style="width:100%">
      <label>学校 School</label>
      <input type="text" id="rSchool" style="width:100%" value="百德中学 Bukit View Secondary School">
      <label>电邮 Email</label>
      <input type="email" id="rEmail" style="width:100%" autocomplete="username">
      <label>设置密码 Password（至少 6 位）</label>
      <input type="password" id="rPassword" style="width:100%" autocomplete="new-password">
      <div style="margin-top:14px"><button class="btn primary" id="registerBtn">提交注册申请</button></div>
    </div>

    <div class="msg" id="signinMsg"></div>
  </div>

  <!-- signed in, but not yet an approved teacher -->
  <div class="card signin" id="statusCard" style="display:none">
    <h2 style="margin-top:0" id="statusTitle"></h2>
    <div class="hint" id="statusBody" style="margin-bottom:8px"></div>
    <div id="registerHere" style="display:none">
      <label>姓名 Name</label><input type="text" id="rName2" style="width:100%">
      <label>学校 School</label><input type="text" id="rSchool2" style="width:100%" value="百德中学 Bukit View Secondary School">
      <div style="margin-top:12px"><button class="btn primary" id="submitReqBtn">提交注册申请</button></div>
    </div>
    <div style="margin-top:14px"><button class="btn" id="statusSignOut">退出登录</button></div>
    <div class="msg" id="statusMsg"></div>
  </div>

  <!-- dashboard -->
  <div id="dash" style="display:none">
    <div class="tabs">
      <button class="tab on" data-tab="overview">概览</button>
      <button class="tab" data-tab="classes">班级视图</button>
      <button class="tab" data-tab="hard">词语难点</button>
      <button class="tab" data-tab="restores">恢复记录</button>
      <button class="tab" data-tab="arena">结伴登峰</button>
      <button class="tab" data-tab="approvals" id="apprTab" style="display:none">审批教师</button>
      <button class="tab" data-tab="mod" id="modTab" style="display:none">处理</button>
    </div>
    <div class="row" style="margin-bottom:14px">
      <button class="btn primary" id="loadBtn">载入 / 刷新数据</button>
      <span class="hint" id="loadInfo">数据不会自动刷新，请手动载入。</span>
    </div>
    <div id="panel"></div>
  </div>
</div>

  function schoolKey(s) {
    return String(s == null ? "" : s).toLowerCase().replace(/[\s'’.,()（）·・]/g, "");
  }
  var CANON_BY_KEY = {};
  [SCHOOL_BVSS].concat(SCHOOL_LIST).forEach(function (name) {
    CANON_BY_KEY[schoolKey(name)] = name;
    var m = name.match(/^([^A-Za-z]+)\s+(.+)$/);   // "中文 English" → also index each half
    if (m) { CANON_BY_KEY[schoolKey(m[1])] = name; CANON_BY_KEY[schoolKey(m[2])] = name; }
  });
  var SCHOOL_ALIAS = {};
  (function () {
    var add = function (canon, variants) { variants.forEach(function (v) { SCHOOL_ALIAS[schoolKey(v)] = canon; }); };
    add("圣婴中学 Holy Innocents' High School", ["HIHS", "Holy Innocents", "Holy Innocents High", "Holy Innocents' High"]);
    add(SCHOOL_BVSS, ["BVSS", "Bukit View", "Bukit View Sec", "Bukit View Secondary"]);

  function canonSchool(raw) {
    var s = String(raw == null ? "" : raw).trim().replace(/\s+/g, " ");
    if (!s) return "（未填写）";
    var k = schoolKey(s);
    return SCHOOL_ALIAS[k] || CANON_BY_KEY[k] || s;   // unknown: show the trimmed original
  }

  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];

  /* ---------- auth ---------- */
  el("signInBtn").onclick = function () {
    var m = el("signinMsg"); m.className = "msg"; m.textContent = "登录中…";

  };
  el("resetBtn").onclick = function () {
    var m = el("signinMsg");
    var email = el("email").value.trim();
    if (!email) { m.className = "msg bad"; m.textContent = "请先填写电邮，再点忘记密码。"; return; }
    auth.sendPasswordResetEmail(email)
      .then(function () { m.className = "msg ok"; m.textContent = "重置密码的邮件已发送，请查收。"; })
      .catch(function (e) { m.className = "msg bad"; m.textContent = "发送失败：" + (e.code || e.message); });
  };
  el("signOutBtn").onclick = function () { auth.signOut(); };
  el("statusSignOut").onclick = function () { auth.signOut(); };

  /* login / register tab switch on the sign-in card */
  el("tabLogin").onclick = function () {
    el("tabLogin").classList.add("on"); el("tabRegister").classList.remove("on");
    el("loginPane").style.display = ""; el("registerPane").style.display = "none";
    el("signinMsg").textContent = "";
  };
  el("tabRegister").onclick = function () {
    el("tabRegister").classList.add("on"); el("tabLogin").classList.remove("on");
    el("registerPane").style.display = ""; el("loginPane").style.display = "none";
    el("signinMsg").textContent = "";
  };

  /* self-registration: create the auth account, then file a teacherRequests doc.
     No access is granted until an HOD approves (writes teachers/{uid}). */
  el("registerBtn").onclick = function () {
    var m = el("signinMsg"); m.className = "msg";
    var name = el("rName").value.trim(), school = el("rSchool").value.trim();
    var email = el("rEmail").value.trim(), pw = el("rPassword").value;
    if (!name || !email || pw.length < 6) { m.className = "msg bad"; m.textContent = "请填写姓名、电邮，密码至少 6 位。"; return; }
    m.textContent = "注册中…";
    auth.createUserWithEmailAndPassword(email, pw).then(function (cred) {
      return fileRequest(cred.user.uid, name, school, email);
    }).catch(function (e) { m.className = "msg bad"; m.textContent = "注册失败：" + (e.code || e.message); });
    // onAuthStateChanged then shows the pending screen
  };

  function fileRequest(uid, name, school, email) {
    return db.collection("teacherRequests").doc(uid).set({
      name: name, school: school, email: email,
      status: "pending", requestedAt: new Date().toISOString()
    });

  auth.onAuthStateChanged(function (user) {
    // ignore any leftover anonymous session (student pages sign in anonymously
    // in the same browser); teachers use real email/password accounts.
    if (!user || user.isAnonymous) { showSignedOut(); return; }
    db.collection("teachers").doc(user.uid).get().then(function (snap) {
      var d = snap.exists ? snap.data() : null;
      if (d && d.active === true) { _me = d; showSignedIn(user, d); return; }
      // signed in but not (yet) an approved teacher: pending, revoked, or new
      db.collection("teacherRequests").doc(user.uid).get().then(function (rs) {
        if (rs.exists) showStatus(user, "pending", rs.data());
        else if (d && d.active === false) showStatus(user, "revoked");
        else showStatus(user, "register");
      }).catch(function () { showStatus(user, "register"); });
    }).catch(function (e) {

    el("whoami").textContent = "";
    if (msg) { var m = el("signinMsg"); m.className = "msg bad"; m.textContent = msg; }
  }
  function showSignedIn(user, d) {
    hideAll();
    el("dash").style.display = "";
    el("signOutBtn").style.display = "";
    el("whoami").textContent = (d.name || user.email) + " · " + (d.role === "hod" ? "HOD" : "教师");
    el("modTab").style.display = (d.role === "hod") ? "" : "none";
    el("apprTab").style.display = (d.role === "hod") ? "" : "none";
  }
  function showStatus(user, kind, req) {
    hideAll();
    el("statusCard").style.display = "";
    el("signOutBtn").style.display = "none";
    el("whoami").textContent = user.email;
    el("registerHere").style.display = "none";
    el("statusMsg").textContent = "";
    if (kind === "pending") {
      el("statusTitle").textContent = "申请审批中";
      el("statusBody").innerHTML = "你的教师注册申请已提交，正在等待 HOD 审批。通过后用同一电邮登录即可使用。<br>电邮：" + esc(user.email);

  function renderHard(panel) {
    // aggregate: how many students in the filtered set have mastered each word id
    var set = filteredUsers().filter(function (u) { return profOf(u).category === "student"; });
    var count = {};
    set.forEach(function (u) {
      STREAMS.forEach(function (s) {
        var p = u.data.progress && u.data.progress[s];
        if (p && p.mastered) Object.keys(p.mastered).forEach(function (id) { count[id] = (count[id] || 0) + 1; });
      });
    });
    // rank words by LOWEST mastered count. Only meaningful with the word map.
    var ids = _wordMap ? Object.keys(_wordMap) : Object.keys(count);
    var rankable = ids.map(function (id) { return { id: id, n: count[id] || 0, w: _wordMap && _wordMap[id] }; })
      .filter(function (r) { return r.w; });
    rankable.sort(function (a, b) { return a.n - b.n; });
    var top = rankable.slice(0, 60);
    var rows = top.map(function (r) {
      return '<tr><td><b>' + esc(r.w.w) + '</b></td><td>' + esc(r.w.zh || "") + '</td>' +
        '<td>' + esc(STREAM_LABEL[r.w.stream]) + '·' + esc(r.w.level) + '·' + esc(r.w.unit) + '</td>' +
        '<td>' + r.n + ' / ' + set.length + '</td></tr>';

      el("arRpY").onclick = function () { _setup.rainPy = true; renderArenaSetup(panel); };
      el("arRpN").onclick = function () { _setup.rainPy = false; renderArenaSetup(panel); };
      el("arRl").innerHTML = [[0, "时间制"], [3, "3 命"], [5, "5 命"], [8, "8 命"]].map(function (o) {
        return '<button class="btn arRl' + (o[0] === _setup.rainLives ? " primary" : "") + '" data-l="' + o[0] + '">' + o[1] + '</button>';
      }).join(" ");
      Array.prototype.forEach.call(el("arRl").querySelectorAll(".arRl"), function (b) { b.onclick = function () { _setup.rainLives = parseInt(b.getAttribute("data-l"), 10); renderArenaSetup(panel); }; });
    }
    el("arQ").value = String(_setup.qCount); el("arQ").onchange = function () { _setup.qCount = parseInt(this.value, 10); };
    el("arDur").value = String(_setup.durationS); el("arDur").onchange = function () { _setup.durationS = parseInt(this.value, 10); };
    fetchStreamJson(_setup.stream).then(function (data) {
      var sc = el("arScope");
      sc.innerHTML = '<div style="margin-bottom:6px"><button class="btn" id="arAll">全选</button> <button class="btn" id="arNone">清空</button></div>' +
        data.units.map(function (u) { return '<label style="display:inline-block;margin:3px 10px 3px 0;font-weight:400"><input type="checkbox" class="arU" value="' + esc(u.key) + '"' + (_setup.scope[u.key] ? " checked" : "") + '> ' + esc(u.key) + ' (' + u.count + ')</label>'; }).join("");
      Array.prototype.forEach.call(sc.querySelectorAll(".arU"), function (c) { c.onchange = function () { if (c.checked) _setup.scope[c.value] = 1; else delete _setup.scope[c.value]; }; });
      el("arAll").onclick = function () { data.units.forEach(function (u) { _setup.scope[u.key] = 1; }); renderArenaSetup(panel); };
      el("arNone").onclick = function () { _setup.scope = {}; renderArenaSetup(panel); };
    }).catch(function () { el("arScope").textContent = "词库载入失败。"; });
    el("arGen").onclick = function () { generateRoom(panel); };
  }

  function generateRoom(panel) {
    var m = el("arMsg"); m.className = "msg";
    if (!Object.keys(_setup.scope).length) { m.className = "msg bad"; m.textContent = "请至少选择一个单元。"; return; }
    m.textContent = "生成中…";
    fetchStreamJson(_setup.stream).then(function (data) {
      var pool = [];
      Object.keys(_setup.scope).forEach(function (k) { (data.byKey[k] || []).forEach(function (w) { pool.push(w); }); });
      if (_setup.mode === "cloze") pool = pool.filter(function (w) { return w.cloze && w.cloze.indexOf("__") !== -1; });
      if (_setup.mode === "rain") pool = pool.filter(function (w) { return w.w && w.w.length <= 4; });
      var minNeed = _setup.mode === "rain" ? 8 : 4;
      if (pool.length < minNeed) { m.className = "msg bad"; m.textContent = "所选范围可用词太少（本模式需要至少 " + minNeed + " 个）。"; return; }
      for (var i = pool.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
      var q = Math.min(_setup.qCount, pool.length);
      tryCreate(pool.slice(0, q).map(function (w) { return w.id; }), q, 0, m, panel);
    });
  }
  function tryCreate(wordIds, q, attempt, m, panel) {
    if (attempt >= 3) { m.className = "msg bad"; m.textContent = "生成失败，请重试。"; return; }
    var code = arenaCode(), doc = db.collection("rooms").doc(code);
    doc.get().then(function (snap) {
      if (snap.exists) return tryCreate(wordIds, q, attempt + 1, m, panel);
      var roomDoc = {
        hostUid: auth.currentUser.uid, hostName: (_me && _me.name) || "老师", school: (_me && _me.school) || "",
        stream: _setup.stream, mode: _setup.mode, tier: _setup.tier, scope: Object.keys(_setup.scope),
        wordIds: wordIds, qCount: q, durationS: _setup.durationS, status: "lobby",
        createdAt: firebase.firestore.FieldValue.serverTimestamp(), startedAt: null,
        expiresAt: firebase.firestore.Timestamp.fromDate(new Date(Date.now() + 6 * 3600 * 1000)), playerCount: 0
      };
      if (_setup.mode === "rain") {
        roomDoc.gameCfg = { speed: _setup.rainSpeed, ramp: _setup.rainRamp, py: _setup.rainPy, lives: _setup.rainLives };
      }
      return doc.set(roomDoc).then(function () { _arena.code = code; _arena.players = []; _arena.room = null; subscribeArena(); renderArena(panel); });
    }).catch(function (e) { m.className = "msg bad"; m.textContent = "创建失败：" + (e.code || e.message) + "（请确认 rooms 规则已发布）。"; });
  }

  function subscribeArena() {
    if (_arena.unsub) _arena.unsub();
    if (_arena.punsub) _arena.punsub();
    _arena.unsub = db.collection("rooms").doc(_arena.code).onSnapshot(function (snap) {
      _arena.room = snap.exists ? snap.data() : null;
      if (_tab === "arena") renderArenaLive(el("panel"));
    });
    _arena.punsub = db.collection("rooms").doc(_arena.code).collection("players").onSnapshot(function (qs) {
      var rows = []; qs.forEach(function (d) { rows.push(Object.assign({ uid: d.id }, d.data())); });
      _arena.players = rows;
      // keep the room's playerCount current so student lobbies show a live count
      // (only the host may write the room doc; write only on change)
      var room = _arena.room || {};
      if ((room.playerCount || 0) !== rows.length && room.status !== "ended") {
        db.collection("rooms").doc(_arena.code).set({ playerCount: rows.length }, { merge: true }).catch(function () {});
      }
      if (_tab === "arena") renderArenaLive(el("panel"));
    });
  }

  function statusZh(s) { return s === "running" ? "进行中" : s === "ended" ? "已结束" : "等待开始"; }
  function arenaRemaining() {
    var room = _arena.room || {};
    if (room.status !== "running" || !room.startedAt || !room.startedAt.toMillis) return null;
    return Math.max(0, Math.round((room.startedAt.toMillis() + (room.durationS || 0) * 1000 - Date.now()) / 1000));
  }
  function renderArenaLive(panel) {
    var room = _arena.room || {};
    var rows = _arena.players.slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
    var status = room.status || "lobby", rem = arenaRemaining();
    panel.innerHTML = '<div class="card arena-live" id="arenaCard">' +
      '<div class="row" style="align-items:center"><h2 style="margin:0">结伴登峰</h2>' +
      '<span class="hint" style="margin-left:auto">' + (STREAM_LABEL[room.stream] || "") + ' · ' + (ARENA_MODE_ZH[room.mode] || "") + ' · ' + (room.qCount || "") + ' 题 · ' + Math.round((room.durationS || 0) / 60) + ' 分钟</span></div>' +
      '<div class="arena-code">' + esc(_arena.code) + '</div>' +
      '<div class="row" style="justify-content:center;font-size:16px">👥 <b id="arPc">' + rows.length + '</b> 人 · <span id="arSt">' + statusZh(status) + '</span>' + (rem != null ? ' · ⏱ <b id="arRem">' + rem + 's</b>' : '') + '</div>' +
      '<div class="scroll" style="margin-top:12px"><table><thead><tr><th>#</th><th>昵称</th><th>班级</th><th>答对/已答</th><th>得分</th></tr></thead><tbody>' +
      (rows.map(function (r, i) { return '<tr><td>' + (i + 1) + '</td><td>' + esc(r.nickname || "") + (r.late ? " ⏱" : "") + '</td><td>' + esc(r.mtlClass || "未填班级") + '</td><td>' + (r.correct || 0) + '/' + (r.answered || 0) + '</td><td><b>' + (r.score || 0) + '</b></td></tr>'; }).join("") || '<tr><td colspan="5" class="hint">等待学生加入…</td></tr>') +
      '</tbody></table></div>' +
      '<div class="row" style="margin-top:14px">' +
      (status === "lobby" ? '<button class="btn primary" id="arStart">开始</button>' : '') +
      (status !== "ended" ? '<button class="btn" id="arEnd">结束</button>' : '') +
      '<button class="btn" id="arCsv">导出CSV</button><button class="btn" id="arFs">全屏</button>' +
      '<button class="btn" id="arClose">关闭这场</button></div><div class="msg" id="arLiveMsg"></div></div>';
    var b;
    if ((b = el("arStart"))) b.onclick = startArena;
    if ((b = el("arEnd"))) b.onclick = endArena;
    el("arCsv").onclick = exportArenaCsv;
    el("arFs").onclick = function () { var c = el("arenaCard"); if (c && c.requestFullscreen) c.requestFullscreen().catch(function () {}); };
    el("arClose").onclick = closeArena;
    if (_arena.tick) clearInterval(_arena.tick);
    if (status === "running") _arena.tick = setInterval(function () {
      var r = arenaRemaining(), t = el("arRem"); if (t && r != null) t.textContent = r + "s";
    }, 1000);
  }
  function startArena() {
    db.collection("rooms").doc(_arena.code).set({ status: "running", startedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true })
      .catch(function (e) { var m = el("arLiveMsg"); if (m) { m.className = "msg bad"; m.textContent = "开始失败：" + (e.code || e.message); } });
  }
  function endArena() { db.collection("rooms").doc(_arena.code).set({ status: "ended" }, { merge: true }).catch(function () {}); }
  function closeArena() {
    var code = _arena.code;
    if (_arena.unsub) _arena.unsub(); if (_arena.punsub) _arena.punsub(); if (_arena.tick) clearInterval(_arena.tick);
    // best-effort cleanup (TTL removes the room in ~6h but doesn't cascade to players)
    _arena.players.forEach(function (r) { db.collection("rooms").doc(code).collection("players").doc(r.uid).delete().catch(function () {}); });
    db.collection("rooms").doc(code).delete().catch(function () {});
    _arena = { code: null, unsub: null, punsub: null, room: null, players: [], tick: null, json: _arena.json };
    renderArena(el("panel"));
  }
  function exportArenaCsv() {
    var rows = _arena.players.slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
    var csv = "排名,昵称,班级,答对,已答,得分\n" + rows.map(function (r, i) {
      return [i + 1, '"' + (r.nickname || "") + '"', '"' + (r.mtlClass || "") + '"', r.correct || 0, r.answered || 0, r.score || 0].join(",");
    }).join("\n");
    var blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = "arena_" + _arena.code + ".csv"; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  function renderMod(panel) {
    if (!_me || _me.role !== "hod") { panel.innerHTML = '<div class="card hint">仅 HOD 可处理。</div>'; return; }
    panel.innerHTML =
      '<div class="card"><h2 style="margin-top:0">处理（仅 HOD）</h2>' +
      '<div class="hint">对确认作弊的学生写入一条 moderation 记录。学生下次在该设备联网打开时生效，' +
      '把该科目进度清零。这是社群约束，不是严格封锁：清空浏览器数据会换新 UID、同时丢失全部进度，' +
      '所以规避的代价与被清零相同。</div>' +
      '<label>学生 UID</label><input id="mUid" style="width:100%" placeholder="从「恢复记录」或学生的技术编号获取">' +
      '<div class="row"><div><label>动作</label><select id="mAction"><option value="zero">清零该科目 zero</option></select></div>' +
      '<div><label>科目</label><select id="mStream">' + STREAMS.map(function (s) { return '<option value="' + s + '">' + STREAM_LABEL[s] + '</option>'; }).join("") + '</select></div></div>' +
      '<label>备注</label><input id="mNote" style="width:100%" placeholder="例如：2026-08-12 使用了同学的进度码">' +
      '<div style="margin-top:14px"><button class="btn primary" id="mSave">写入处理记录</button></div>' +
      '<div class="msg" id="mMsg"></div></div>';
    el("mSave").onclick = function () {
      var uid = el("mUid").value.trim();
      var m = el("mMsg");
      if (!uid) { m.className = "msg bad"; m.textContent = "请填写学生 UID。"; return; }
      db.collection("moderation").doc(uid).set({
        action: el("mAction").value, stream: el("mStream").value,
        at: new Date().toISOString(), note: el("mNote").value.trim(),
        by: (_me && _me.name) || ""
      }).then(function () { m.className = "msg ok"; m.textContent = "已写入。学生下次联网打开该科目时生效。"; })
        .catch(function (e) { m.className = "msg bad"; m.textContent = "写入失败：" + (e.code || e.message); });
    };
  }
})();
</script>
</body>
</html>
